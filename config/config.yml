# Wiki-Brain 配置文件
# 环境变量优先级高于此文件，格式：WB_<大写字段路径>，如 WB_LLM_BASE_URL

# LLM 配置
llm:
  api_key:           "sk-7b7e0e6749d14e8b83381e0b8ac809e5"
  base_url:          "https://dashscope.aliyuncs.com/compatible-mode/v1"
  timeout_seconds:   120
  max_retries:       3
  models:
    default:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0
      max_input_tokens: 4096
      max_output_tokens: 4096
      thinking:          false
    reasoning:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0.1
      max_input_tokens: 4096
      max_output_tokens: 8192
      thinking:         true
    extraction:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0
      max_input_tokens: 4096
      max_output_tokens: 8192
      thinking:         false
    classification:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0
      max_input_tokens: 4096
      max_output_tokens: 4096
      thinking:         false

# HTTP 服务器
server:
  host:            "0.0.0.0"            # 监听地址，0.0.0.0 表示所有网卡，127.0.0.1 仅本机
  port:            8800                 # 监听端口
  path_prefix:     ""                   # URL 前缀，如 "/api"；为空表示根路径
  read_timeout:    "30s"
  write_timeout:   "60s"
  max_concurrency: 100                  # 最大并发请求数，0 表示不限制

# 日志配置
logging:
  level:          "info"                # 日志级别：debug / info / warn / error
  console:        true                  # 业务日志是否输出到控制台
  file:           true                  # 是否输出到文件
  dir:            "logs"                # 日志文件存放目录
  filename:       "wiki-brain.log"      # 日志文件名
  max_size_mb:    10                    # 单个日志文件大小上限（MB），超出后轮转
  max_backups:    5                     # 保留的历史轮转文件数量，0 表示不限制
  max_age_days:   0                     # 历史轮转文件保留天数，0 表示不按天数清理
  compress:       false                 # 轮转后的历史文件是否压缩（gzip）
  access_console: false                 # 访问日志（http request）是否额外打印到控制台

# 数据库
database:
  path: "data/wiki-brain.db"            # SQLite 文件路径，相对于工作目录

# Bleve 全文索引
index:
  path: "data/searchindex"              # 索引根目录，内含 units / points / outlines 子目录

# 异步任务队列
queue:
  buffer_size: 100                      # buffered channel 容量
  workers:     2                        # 并发消费者数量

# FileView 服务（格式转换）
fileview:
#  base_url:          "http://127.0.0.1:8000"
  base_url:          "http://192.168.0.169:9000"
  poll_interval_ms:  1500
  max_poll_seconds:  600

# Source 模块
source:
  upload_dir:            "data/sources"
  segment_max_chars:     2000           # 大纲叶节点最大字符数（rune），超过此值在 Source 层触发语义目录细化
  min_segment_chars:     400            # Unit 切块：相邻叶节点合计低于此值时合并
  pre_insert_dedup_min_overlap: 0.15    # 相邻两个 unit 原文分词重叠度低于此值时跳过 LLM 去重调用
  pre_insert_dedup_concurrency: 2       # 并发提取的 segment 数
  pre_insert_dedup_short_token_max: 4   # 相邻两个 unit 有一方有效分词数（排除标点）≤ 此值时，跳过重叠度过滤直接问 LLM

# Retrieval 模块
retrieval:
  outline_fts_min_score: 0.5
  rerank_top_n:          20
  rerank_extract_batch_max_chars: 4000  # 单次语义抽取传给模型的 KU 正文字符预算，超出后按 KU 切 batch
  rerank_extract_concurrency:     2     # 语义抽取 batch 并发数
  rerank_judge_batch_max_chars:   4000  # 单次 rerank 判断传给模型的候选语义字符预算
  rerank_judge_concurrency:       4     # rerank 判断 batch 并发数
  activation_match_min:          0.7   # 步骤2 计分阈值（docs/impl/v1/activation.md）
  activation_match_min_fallback: 0.85  # 四元组缺失时的回退匹配阈值
  activation_match_top:          5     # 匹配结果保留条数
  fast_path:              true   # false 时激活层只记录命中、不走快路径（灰度开关）
  fast_path_fallback:     true   # 快路径回答失败时自动回落慢路径
  wiki_min_score:         2.0    # Wiki 直答的 Bleve 最低分（Wiki 模块未实现前不生效）

# Evidence 模块
evidence:
  enabled:              true
  batch_max_chars:      6000   # 单次 LLM 调用携带的 KU 正文字符数上限（rune）
  max_fragments_per_ku: 5      # 单 KU 最多保留片段数（超出按输出顺序截断）
  min_fragment_chars:   8      # 短于该长度的片段丢弃（无信息量）
  retry:                1      # 批次级 JSON/Schema 失败重试次数

# 跨 Source KPN 模块
kpn:
  cross_max_batches: 20  # 单个 source 的跨源匹配批次总数上限，超出放弃剩余

# Wiki 模块
wiki:
  compile_max_chars:    12000  # 单页编译输入合计上限（rune），超出按 confident_count 降序截取 KP
  recompile_new_kp_min: 2      # 已发布页面依赖概念新增 qualifying KP 达到该数量触发重编译标记

# Study 模块
study:
  schedule_interval:       "1h"
  candidate_confident_min: 5
  candidate_ratio_min:     0.6
  wiki_kp_min:             4
  wiki_confident_min:      8
  gap_hit_threshold:       3
  scan_batch_size:         200
  report_period_days:      5
  report_max_keep:         10
  # —— V1 新增 ——
  auto_promote:            false  # true 时晋升不经人工确认
  promote_success_min:     3      # 晋升所需窗口内 activation_success 事件数
  promote_distinct_min:    2      # 且来自 ≥ N 个不同 question_hash（防单一问题刷信号）
  weaken_failure_min:      3      # 降权所需窗口内 activation_failure 事件数
  weaken_ratio_min:        0.5    # 且窗口内 failure / (success+failure) ≥ 该比值
  reverify_success_min:    2      # weakened 重新验证所需窗口内 success 数
  event_window_days:       30     # 上述累积判定的时间窗口
  candidate_idle_days:     30     # candidate 无新信号自动淘汰
  deprecate_idle_days:     60     # weakened 无有效使用自动淘汰
  correction_weight:       2      # user_correction 关联链接时按 N 次 failure 计
  # —— 概念演化（V1 新增）——
  concept_null_ratio_min:      0.7   # concept_gap 判定：无概念归属 KP 占比下限
  concept_add_event_min:       5     # 新增候选：簇内 concept_gap 事件数下限
  concept_add_distinct_min:    3     # 且来自 ≥ N 个不同 question_hash
  concept_add_overlap_min:     0.5   # 簇内事件 KP 集合两两 Jaccard 重叠下限
  concept_merge_cooccur_min:   5     # 合并候选：概念对共同采用次数下限
  concept_merge_overlap_min:   0.6   # 且共同采用中 KP 重叠比例下限
  concept_candidate_idle_days: 60    # 候选无新信号自动过期
  concept_event_window_days:   90    # 聚合统计的时间窗口（长于链接窗口）
