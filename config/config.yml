# Wiki-Brain 配置文件
# 环境变量优先级高于此文件，格式：WB_<大写字段路径>，如 WB_LLM_BASE_URL

# LLM 配置
llm:
  api_key:           "sk-ws-H.EIHEDMI.xWSE.MEQCIAUqkSSOSoIzTE4DZCVAdWc84C3WNJgp6eHJfZsLhVYtAiBrw11oQke4KjEgM-A1PxjEE6aw4tjH7RBhkq94ahc55g"
  base_url:          "https://dashscope.aliyuncs.com/compatible-mode/v1"
  timeout_seconds:   120
  max_retries:       3
  models:
    default:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0
      max_input_tokens: 4096
      max_output_tokens: 4096
      thinking:          false
    reasoning:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0.1
      max_input_tokens: 4096
      max_output_tokens: 8192
      thinking:         true
    extraction:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0
      max_input_tokens: 4096
      max_output_tokens: 8192
      thinking:         false
    classification:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0
      max_input_tokens: 4096
      max_output_tokens: 4096
      thinking:         false

# HTTP 服务器
server:
  host:            "0.0.0.0"            # 监听地址，0.0.0.0 表示所有网卡，127.0.0.1 仅本机
  port:            8800                 # 监听端口
  path_prefix:     ""                   # URL 前缀，如 "/api"；为空表示根路径
  read_timeout:    "30s"
  write_timeout:   "300s"  # Wiki 编译 LLM 调用预算从 2 次涨到约 10-12 次（docs/impl/v1/wiki-generation.md 阶段 0），120s 不够用
  max_concurrency: 100                  # 最大并发请求数，0 表示不限制

# 日志配置
logging:
  level:          "info"                # 日志级别：debug / info / warn / error
  console:        true                  # 业务日志是否输出到控制台
  file:           true                  # 是否输出到文件
  dir:            "logs"                # 日志文件存放目录
  filename:       "wiki-brain.log"      # 日志文件名
  max_size_mb:    10                    # 单个日志文件大小上限（MB），超出后轮转
  max_backups:    5                     # 保留的历史轮转文件数量，0 表示不限制
  max_age_days:   0                     # 历史轮转文件保留天数，0 表示不按天数清理
  compress:       false                 # 轮转后的历史文件是否压缩（gzip）
  access_console: false                 # 访问日志（http request）是否额外打印到控制台

# 数据库
database:
  path: "data/wiki-brain.db"            # SQLite 文件路径，相对于工作目录

# Bleve 全文索引
index:
  path: "data/searchindex"              # 索引根目录，内含 units / points / outlines 子目录

# 异步任务队列
queue:
  buffer_size: 100                      # buffered channel 容量
  workers:     2                        # 并发消费者数量

# FileView 服务（格式转换）
fileview:
#  base_url:          "http://127.0.0.1:8000"
  base_url:          "http://192.168.0.169:9000"
  poll_interval_ms:  1500
  max_poll_seconds:  600

# Source 模块
source:
  upload_dir:            "data/sources"
  segment_max_chars:     2000           # 大纲叶节点最大字符数（rune），超过此值在 Source 层触发语义目录细化
  min_segment_chars:     400            # Unit 切块：相邻叶节点合计低于此值时合并
  pre_insert_dedup_min_overlap: 0.15    # 相邻两个 unit 原文分词重叠度低于此值时跳过 LLM 去重调用
  pre_insert_dedup_concurrency: 2       # 并发提取的 segment 数
  pre_insert_dedup_short_token_max: 4   # 相邻两个 unit 有一方有效分词数（排除标点）≤ 此值时，跳过重叠度过滤直接问 LLM

# Retrieval 模块
retrieval:
  outline_fts_min_score: 0.5
  rerank_top_n:          20
  rerank_extract_batch_max_chars: 4000  # 单次语义抽取传给模型的 KU 正文字符预算，超出后按 KU 切 batch
  rerank_extract_batch_max_units: 8     # 单次语义抽取一批最多传的 KU 数量，超出后按数量切 batch（和字符预算取更严的那个）
  rerank_extract_concurrency:     2     # 语义抽取 batch 并发数
  rerank_judge_batch_max_chars:   4000  # 单次 rerank 判断传给模型的候选语义字符预算
  rerank_judge_concurrency:       4     # rerank 判断 batch 并发数
  rerank_judge_include_analysis:  false # false 时 rerank judge 不再要求逐条输出 analysis
                                         # 说明文字（仅用于 debug 日志，不参与判断逻辑），
                                         # 用于 A/B 测试是否能降低 rerank 阶段延迟；
                                         # 省略该键等价于 true（保留现有行为）
  activation_match_top:          5     # 匹配结果保留条数（四元组完全匹配，无阈值可调）
  fast_path:              true   # false 时激活层只记录命中、不走快路径（灰度开关）
  fast_path_verify:       true   # 快路径证据充分性校验开关（false 时跳过校验，仅灰度/评估用）
  slow_path_verify:       true   # 慢路径答题前充分性校验：sufficient=false 时拒答（防近邻概念串台）
  fast_path_fallback:     true   # 快路径回答失败时自动回落慢路径
  wiki_min_score:         2.0    # Wiki 直答的 Bleve 最低分（Wiki 模块未实现前不生效）
  wiki_max_candidates:    3      # 直答候选序列长度上限（词法+概念入口合并去重后依次尝试，首个 sufficient=true 即停；设 1 退化为原 top-1 行为）
  skeleton_injection_enabled: false  # 主题页骨架注入灰度开关，默认关闭，观测 resolved_outside_count 后再打开

# Evidence 模块
evidence:
  enabled:              true
  batch_max_chars:      6000   # 单次 LLM 调用携带的 KU 正文字符数上限（rune）
  max_fragments_per_ku: 5      # 单 KU 最多保留片段数（超出按输出顺序截断）
  min_fragment_chars:   8      # 短于该长度的片段丢弃（无信息量）
  retry:                1      # 批次级 JSON/Schema 失败重试次数
  concurrency:           4      # 候选被切分为多个 batch 时并发执行的 batch 数上限
                                 # （docs/impl/v1/evidence.md 步骤 1 允许并发，此前实现是串行的；
                                 #  2026-08-07 实测：5 batch 的问题串行挖掘耗时 13.1s，是长尾主因）

# 跨 Source KPN 模块
kpn:
  cross_max_batches: 20  # 单个 source 的跨源匹配批次总数上限，超出放弃剩余

# Wiki 模块
wiki:
  compile_max_chars:            12000  # 单页编译输入合计上限（rune），超出按 confident_count 降序截取 KP
  recompile_new_kp_min:         2      # 已发布页面依赖概念新增 qualifying KP 达到该数量触发重编译标记
  trigger_questions_max:        10     # aliases / trigger_questions 各自条数上限，超出截断保留前 N 条
  qualifying_min_days_active:  7      # 概念级 ready 判定新增门槛："持续采用"要求 qualifying KP 的激活事件覆盖至少 N 天

  # 两层架构（步骤 7-9）
  relation_kpn_min:             1    # 派生 related 所需的 KPN related 关系对数
  relation_shared_point_min:    2    # 派生 related 的另一条件：共享 KP 数
  topic_member_min:             3    # 重编译后主题页剩余成员数的下限（2026-08-03 起不再兼作候选创建
                                     # 时的成员数门槛——新机制的候选范围来自四元组聚类，不设创建时的
                                     # 成员数上限）
  topic_compile_max_chars:      24000 # 二阶编译输入上限（成员页面正文合计）

  # 主题候选识别（步骤 8，2026-08-03 新增，四元组聚类替代连通分量）
  topic_cluster_min_questions:  3    # 稳定簇判定：分组内不同问法数下限
  topic_cluster_min_days_active: 7   # 稳定簇判定：分组激活时间跨度下限（与 qualifying_min_days_active
                                     # 相同的 DaysActive 计算口径）
  topic_candidate_kp_max:       50   # 候选范围语义检索的知识点数上限
  topic_reliability_min:        0.5  # 二阶准入「整体可靠度」：候选范围全部知识点中 verified 覆盖占比下限

  # 生成质量（docs/impl/v1/wiki-generation.md 阶段 E/G）
  claim_verify_enabled:          true
  selfcheck_enabled:             true
  selfcheck_replay_n:            5
  selfcheck_min_sufficient_rate: 0.6
  selfcheck_min_material_usage:  0.5
  selfcheck_max_uncited_rate:    0.3

  # 概念内聚度（docs/impl/v1/wiki-generation.md 2.2/2.4，Louvain 社区检测）
  entry_cohesion_min:          0.5
  aspect_w_rel:                  1.0
  aspect_w_cooc:                 1.5
  aspect_cooc_sat:               3
  aspect_gamma:                  1.0

  # 完整切面聚类（P1，docs/impl/v1/wiki-generation.md 2.1/2.2）
  aspect_w_intent:               1.0
  aspect_w_unit:                 0.5
  aspect_split_gamma_factor:     1.5
  aspect_min_size:               2
  aspect_max_size:               8
  aspect_questions_max:          5

# Study 模块
study:
  schedule_interval:       "24h"
  candidate_confident_min: 3
  candidate_ratio_min:     0.6
  wiki_kp_min:             4
  gap_hit_threshold:       3
  scan_batch_size:         200
  report_period_days:      5
  report_max_keep:         10
  # —— V1 新增 ——
  auto_promote:            false  # true 时晋升不经人工确认
  promote_success_min:     3      # 晋升所需窗口内 activation_success 事件数
  promote_distinct_min:    2      # 且来自 ≥ N 个不同 question_hash（防单一问题刷信号）
  weaken_failure_min:      3      # 降权所需窗口内 activation_failure 事件数
  weaken_ratio_min:        0.5    # 且窗口内 failure / (success+failure) ≥ 该比值
  reverify_success_min:    2      # weakened 重新验证所需窗口内 success 数
  event_window_days:       30     # 上述累积判定的时间窗口
  candidate_idle_days:     30     # candidate 无新信号自动淘汰
  deprecate_idle_days:     60     # weakened 无有效使用自动淘汰
  correction_weight:       2      # user_correction 关联链接时按 N 次 failure 计
  observed_conditions_max: 50     # ActivationLink 观测条件组上限
  # —— subject 同义词挖掘（V1 新增）——
  synonym_gap_min:          3     # subject_synonym_gap 候选达标所需事件数
  synonym_gap_distinct_min: 2     # 且来自 ≥ N 个不同 question_hash
  synonym_auto_promote:     false # true 时候选直接 active，不经人工确认
  # —— 概念演化（V1 新增）——
  entry_null_ratio_min:      0.7   # entry_gap 判定：无概念归属 KP 占比下限
  entry_add_event_min:       5     # 新增候选：簇内 entry_gap 事件数下限
  entry_add_distinct_min:    3     # 且来自 ≥ N 个不同 question_hash
  entry_add_overlap_min:     0.5   # 簇内事件 KP 集合两两 Jaccard 重叠下限
  entry_merge_cooccur_min:   5     # 合并候选：概念对共同采用次数下限
  entry_merge_overlap_min:   0.6   # 且共同采用中 KP 重叠比例下限
  entry_candidate_idle_days: 60    # 候选无新信号自动过期
  entry_event_window_days:   90    # 聚合统计的时间窗口（长于链接窗口）

  # 问题复杂度观测量（两层架构扩展，只观测不驱动）
  complexity_min_questions:    3     # 条件组内问答数下限，低于此不出报告项
