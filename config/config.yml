# Wiki-Brain 配置文件
# 环境变量优先级高于此文件，格式：WB_<大写字段路径>，如 WB_LLM_BASE_URL

# LLM 配置
llm:
  api_key:           "sk-ws-H.EIHEDMI.xWSE.MEQCIAUqkSSOSoIzTE4DZCVAdWc84C3WNJgp6eHJfZsLhVYtAiBrw11oQke4KjEgM-A1PxjEE6aw4tjH7RBhkq94ahc55g"
  base_url:          "https://dashscope.aliyuncs.com/compatible-mode/v1"
  timeout_seconds:   120
  max_retries:       3
  models:
    default:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0
      max_input_tokens: 4096
      max_output_tokens: 4096
      thinking:          false
    reasoning:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0.1
      max_input_tokens: 4096
      max_output_tokens: 8192
      thinking:         true
    extraction:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0
      max_input_tokens: 4096
      max_output_tokens: 8192
      thinking:         false
    classification:
      model:            "qwen3-30b-a3b-instruct-2507"
      temperature:      0
      max_input_tokens: 4096
      max_output_tokens: 4096
      thinking:         false

# HTTP 服务器
server:
  host:            "0.0.0.0"            # 监听地址，0.0.0.0 表示所有网卡，127.0.0.1 仅本机
  port:            8800                 # 监听端口
  path_prefix:     ""                   # URL 前缀，如 "/api"；为空表示根路径
  read_timeout:    "30s"
  write_timeout:   "300s"  # Wiki 编译 LLM 调用预算从 2 次涨到约 10-12 次（docs/impl/v1/wiki-generation.md 阶段 0），120s 不够用
  max_concurrency: 100                  # 最大并发请求数，0 表示不限制

# 日志配置
logging:
  level:          "info"                # 日志级别：debug / info / warn / error
  console:        true                  # 业务日志是否输出到控制台
  file:           true                  # 是否输出到文件
  dir:            "logs"                # 日志文件存放目录
  filename:       "wiki-brain.log"      # 日志文件名
  max_size_mb:    10                    # 单个日志文件大小上限（MB），超出后轮转
  max_backups:    5                     # 保留的历史轮转文件数量，0 表示不限制
  max_age_days:   0                     # 历史轮转文件保留天数，0 表示不按天数清理
  compress:       false                 # 轮转后的历史文件是否压缩（gzip）
  access_console: false                 # 访问日志（http request）是否额外打印到控制台

# 数据库
database:
  path: "data/wiki-brain.db"            # SQLite 文件路径，相对于工作目录

# Bleve 全文索引
index:
  path: "data/searchindex"              # 索引根目录，内含 units / points / outlines 子目录

# 异步任务队列
queue:
  buffer_size: 100                      # buffered channel 容量
  workers:     2                        # 并发消费者数量

# FileView 服务（格式转换）
fileview:
#  base_url:          "http://192.168.0.169:9000"
  base_url:          "http://127.0.0.1:9100"
  poll_interval_ms:  1500
  max_poll_seconds:  600

# Source 模块
source:
  upload_dir:            "data/sources"
  segment_max_chars:     2000           # 大纲叶节点最大字符数（rune），超过此值在 Source 层触发语义目录细化
  min_segment_chars:     400            # Unit 切块：相邻叶节点合计低于此值时合并
  pre_insert_dedup_min_overlap: 0.15    # 相邻两个 unit 原文分词重叠度低于此值时跳过 LLM 去重调用
  pre_insert_dedup_concurrency: 2       # 并发提取的 segment 数
  pre_insert_dedup_short_token_max: 4   # 相邻两个 unit 有一方有效分词数（排除标点）≤ 此值时，跳过重叠度过滤直接问 LLM

# Retrieval 模块
retrieval:
  outline_fts_min_score: 0.5
  rerank_top_n:          10     # 命中证据平均排第 4.5 名，从 20 下调以减少候选数、降低 rerank 判断耗时
  outline_rrf_boost:     1.3    # 目录召回路径在 rrfMerge 中的分数加权系数（目录命中率 93%，高于 fts/fts_tuple，提高其排序权重）
  rerank_extract_batch_max_chars: 4000  # 单次语义抽取传给模型的 KU 正文字符预算，超出后按 KU 切 batch
  rerank_extract_batch_max_units: 8     # 单次语义抽取一批最多传的 KU 数量，超出后按数量切 batch（和字符预算取更严的那个）
  rerank_extract_concurrency:     2     # 语义抽取 batch 并发数
  rerank_judge_batch_max_chars:   4000  # 单次 rerank 判断（相关性/分类两步共用）传给模型的候选语义字符预算
  rerank_judge_concurrency:       4     # rerank 判断 batch 并发数
  activation_match_top:          5     # 匹配结果保留条数（四元组完全匹配，无阈值可调）
  fast_path:              true   # false 时激活层只记录命中、不走快路径（灰度开关）
  fast_path_verify:       true   # 快路径证据充分性校验开关（false 时跳过校验，仅灰度/评估用）
  slow_path_verify:       true   # 慢路径答题前充分性校验：sufficient=false 时拒答（防近邻概念串台）
  fast_path_fallback:     true   # 快路径回答失败时自动回落慢路径
  wiki_min_score:         2.0    # Wiki 直答的 Bleve 最低分（Wiki 模块未实现前不生效）
  wiki_max_candidates:    3      # 直答候选序列长度上限（词法+概念入口合并去重后依次尝试，首个 sufficient=true 即停；设 1 退化为原 top-1 行为）
  rerank_relevance_concise: false    # true 时证据过滤阶段用 rerank_relevance_concise.md（不输出 analysis，响应更短，但排查判断依据不便）

  # 问题四元组归一化（2026-08-12 新增，默认关闭，见 docs/impl/v1/retrieval.md 步骤 2）
  question_tuple_norm_enabled:      true  # 总开关，关闭时 tryFastPath 行为与改动前完全一致
  question_tuple_norm_local_sim_min: 0.8   # Tier2 本地词集 Jaccard 相似度命中阈值（0-1）
  question_tuple_norm_idle_days:    90     # question_tuple_norms 行超过该天数未命中由 Study 周期清理

  # ActivationLink/Bundle 连续置信度（2026-08-13 新增，取代 study 节原
  # auto_promote/promote_*/weaken_*/reverify_* — 详见 docs/impl/v1/activation.md）
  serving_confidence_min:  0.7    # 服务门槛：mean(cond) 达到此值才算 self_graded/trusted，够格直接服务
  audit_sample_min:        5      # 够格评估 trusted 档所需的独立核实样本量下限
  explore_rate_low:        0.15   # exploring 档：本轮仍被选中试探的概率
  explore_rate_self_graded: 0.10  # self_graded 档：本轮被抽样安排一次独立核实的概率
  explore_rate_trusted:     0.03  # trusted 档：本轮被抽样安排一次独立核实（定期复查防漂移）的概率

# Evidence 模块挖掘
evidence:
  enabled:              false
  batch_max_chars:      6000   # 单次 LLM 调用携带的 KU 正文字符数上限（rune）
  max_fragments_per_ku: 5      # 单 KU 最多保留片段数（超出按输出顺序截断）
  min_fragment_chars:   8      # 短于该长度的片段丢弃（无信息量）
  retry:                1      # 批次级 JSON/Schema 失败重试次数
  concurrency:           4      # 候选被切分为多个 batch 时并发执行的 batch 数上限
                                 # （docs/impl/v1/evidence.md 步骤 1 允许并发，此前实现是串行的；
                                 #  2026-08-07 实测：5 batch 的问题串行挖掘耗时 13.1s，是长尾主因）

# 跨 Source KPN 模块
kpn:
  cross_max_batches: 20  # 单个 source 的跨源匹配批次总数上限，超出放弃剩余

# Wiki 模块
wiki:
  compile_max_chars:            12000  # 单页编译输入合计上限（rune），超出按 confident_count 降序截取 KP
  recompile_new_kp_min:         2      # 已发布页面依赖概念新增 qualifying KP 达到该数量触发重编译标记
  trigger_questions_max:        10     # aliases / trigger_questions 各自条数上限，超出截断保留前 N 条
  qualifying_min_days_active:   5      # P8 冒烟测试临时调低（原值 7），仅验证 ready 判据轴一之外的其余门槛，不代表默认配置下 days_active 真实达标

  # 两层架构（步骤 7-9）
  relation_kpn_min:             1    # 派生 related 所需的 KPN related 关系对数
  relation_shared_point_min:    2    # 派生 related 的另一条件：共享 KP 数

  # 2026-08-18 单层化收尾清理：topic_member_min / topic_compile_max_chars /
  # topic_candidate_kp_max / topic_reliability_min / topic_rerank_batch_max_chars
  # （两层架构主题页专属阈值，此前的自动聚类 topic_cluster_min_questions /
  # topic_cluster_min_days_active 已先行移除）已确认代码无引用，删除。

  # 生成质量（docs/impl/v1/wiki-generation.md 阶段 E/G）
  claim_verify_enabled:          true
  selfcheck_enabled:             true
  selfcheck_replay_n:            5
  selfcheck_min_sufficient_rate: 0.6
  selfcheck_min_material_usage:  0.5
  selfcheck_max_uncited_rate:    0.3

  # 2026-08-18 单层化收尾清理（第二轮）：概念内聚度整条管道（Study
  # CohesionConfig）核实确认已无任何消费方——entry_cohesion_min/aspect_w_rel/
  # aspect_w_cooc/aspect_cooc_sat/aspect_gamma 与完整切面聚类（P1）专属项
  # 一并删除，理由见 docs/impl/v1/wiki-single-tier-open-questions.md。

  # 综合满意度轴（步骤 4a，2026-08-13 新增）
  synthesis_audit_rate:          0.05 # 每次 Wiki 直答服务后，被抽中触发一次
                                       # 独立核实（复用 retrieval.md 步骤 2c
                                       # 的编排），未中选不产生任何 synthesis
                                       # 事件——audit-only，没有自评分支。

# Study 模块
study:
  schedule_interval:       "24h"
  # candidate_confident_min/candidate_ratio_min 已删除（2026-08-13，随
  # docs/design/activation-convergence.md 第 11 节一并替换——创建门槛换成
  # 与「收敛剪枝」同一套 Beta 均值/宽度公式）
  create_confidence_min:   0.55  # mean_pre 门槛，见 docs/impl/v1/study.md 步骤 1
  create_width_max:        0.03  # width_pre 门槛
  wiki_kp_min:             4
  gap_hit_threshold:       3
  scan_batch_size:         200
  report_period_days:      5
  report_max_keep:         10
  # —— V1 新增 ——
  # 2026-08-13：auto_promote/promote_success_min/promote_distinct_min/
  # weaken_failure_min/weaken_ratio_min/reverify_success_min/
  # candidate_idle_days/deprecate_idle_days 已删除（离散状态机随连续置信度
  # 机制一起退休，见 docs/design/activation-convergence.md）——替代方式是
  # retrieval.{serving_confidence_min,audit_sample_min,explore_rate_*}，见
  # 上方 retrieval 节。
  event_window_days:       30     # 报告回看窗口，兼收敛趋势报告与下方剪枝 idle 判定
  correction_weight:       2      # user_correction 关联链接时按 N 次 failure 计
  observed_conditions_max: 50     # ActivationLink 观测条件组上限
  # —— 收敛剪枝（2026-08-13 新增，见 docs/impl/v1/study.md 步骤 3）——
  # candidate_idle_days/deprecate_idle_days 已删除（随离散状态机一起废弃）
  prune_mean_max:    0.3   # mean(cond) 低于此值才可能判"收敛低分"
  prune_width_max:   0.02  # width(cond) 不超过此值才不算"自相矛盾"
  prune_sample_min:  8     # success+failure 达到此值才有把握说"确实收敛"
  prune_idle_days:   30    # 收敛低分剪枝：last_seen_at 距今超过此天数
  prune_stale_days:  90    # 长期闲置剪枝：样本不足 prune_sample_min 且更久未被观测
  # —— subject 同义词挖掘（V1 新增）——
  synonym_gap_min:          3     # subject_synonym_gap 候选达标所需事件数
  synonym_gap_distinct_min: 2     # 且来自 ≥ N 个不同 question_hash
  synonym_auto_promote:     true  # 2026-08-12 新默认（原 false）：候选直接 active，
                                   # 不经人工确认，理由同 auto_promote；错误同义词对
                                   # 最坏是 Match 第一轮多/少命中一次，可事后 reject
  # —— 概念演化（V1 新增）——
  entry_null_ratio_min:      0.7   # entry_gap 判定：无概念归属 KP 占比下限
  entry_add_event_min:       5     # 新增候选：簇内 entry_gap 事件数下限
  entry_add_distinct_min:    3     # 且来自 ≥ N 个不同 question_hash
  entry_add_overlap_min:     0.5   # 簇内事件 KP 集合两两 Jaccard 重叠下限
  entry_merge_cooccur_min:   5     # 合并候选：概念对共同采用次数下限
  entry_merge_overlap_min:   0.6   # 且共同采用中 KP 重叠比例下限
  entry_candidate_idle_days: 60    # 候选无新信号自动过期
  entry_event_window_days:   90    # 聚合统计的时间窗口（长于链接窗口）
  entry_add_auto_confirm:    true  # 2026-08-14 改判：新增概念/事实（kind=add）
                                   # 创建后自动确认，不再需要人工点击"确认"；
                                   # 仅限新增，kind=merge（合并已有概念）仍需
                                   # 人工确认。见 docs/design/concept-evolution.md
                                   # "2026-08-14 改判"

  # 问题复杂度观测量（两层架构扩展，只观测不驱动）
  complexity_min_questions:    3     # 条件组内问答数下限，低于此不出报告项

  # —— ActivationBundle（熟路）阶段 1（docs/impl/v1/activation-bundle.md）——
  # 2026-08-20 重设计：生成门槛复用上面的 create_confidence_min/
  # create_width_max（不新增配置），核心/路肩完全由成员自己的置信度轴派生；
  # bundle_core_ratio_min/bundle_cluster_min_questions/
  # bundle_cluster_min_days_active/bundle_core_size_max 四个键随旧的四元组
  # 聚类生成机制一并删除。promote/weaken/reverify 相关阈值当前只有
  # lifecycle 驱动的降权路径在用，其余留给阶段 2 接入
  # bundle_success/bundle_failure 事件后生效。
  bundle_promote_success_min:      5    # 阶段 2 预留：candidate→verified 窗口成功数下限
  bundle_promote_distinct_min:     4    # 阶段 2 预留：且来自 ≥ N 个不同问题
  bundle_weaken_failure_min:       3    # 阶段 2 预留：verified→weakened 窗口失败数下限
  bundle_weaken_ratio_min:         0.5  # 阶段 2 预留：且失败占比下限
  bundle_reverify_success_min:     3    # 阶段 2 预留：weakened→verified 窗口成功数下限
  bundle_candidate_idle_days:      60   # candidate 无新信号自动过期
  bundle_deprecate_idle_days:      180  # weakened 长期无信号自动 deprecated
  bundle_auto_promote:             true # 默认自动，理由同 study.auto_promote
