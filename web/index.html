async function doUploadFile(file) {
  if (!file) return;
  var uploadGeneration = ++S.sourceTimelineUploadGeneration;
  S.sourceTimelineRequestGeneration++;
  closeSourceTimelineProgress();
  if (S.sourceTimelineUploadSourceId) {
    clearTimeout(S.pollTimers[S.sourceTimelineUploadSourceId]);
    delete S.pollTimers[S.sourceTimelineUploadSourceId];
    S.sourceTimelineUploadSourceId = null;
  }
  var zone = document.getElementById('uploadZone');
  zone.innerHTML = '<div class="uz-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="uz-text" style="font-weight:500">' + esc(file.name) + '</div><div class="uz-hint">' + (file.size/1024).toFixed(0) + ' KB</div>';

  var uploadStart = new Date();
  showTimeline(file.name, 'uploading', null, uploadStart);

  var fd = new FormData();
  fd.append('file', file);
  try {
    var r = await api('POST', '/sources', fd, true);
    if (uploadGeneration !== S.sourceTimelineUploadGeneration) return;
    if (r.ok && r.data) {
      showTimeline(file.name, 'uploaded', r.data, uploadStart);
      pollSourceTimeline(r.data.source_id, file.name, uploadStart, uploadGeneration);
    } else {
      showTimeline(file.name, 'upload_failed', r.data, uploadStart);
    }
  } catch(e) {
    if (uploadGeneration !== S.sourceTimelineUploadGeneration) return;
    showTimeline(file.name, 'upload_failed', null, uploadStart);
  }
  loadSources();
  setTimeout(function() {
    if (uploadGeneration === S.sourceTimelineUploadGeneration) resetUploadZone();
  }, 1500);
}

function resetUploadZone() { document.getElementById('uploadZone').innerHTML = '<div class="uz-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><div class="uz-text">点击或拖拽上传文件</div><div class="uz-hint">MD · TXT · PDF · DOCX · HTML · PPT/PPTX · XLS/XLSX</div>'; }

// ── TIMELINE ──────────────────────────────────────────
var TL_STEPS = [
  { id:'upload',    label:'文件上传' },
  { id:'register',  label:'来源登记' },
  { id:'convert',   label:'Markdown 转换' },
  { id:'units',     label:'知识单元构建' },
  { id:'semantics', label:'提取知识单元语义' }
];

function showTimeline(title, phase, sourceData, uploadStart) {
  var panel = document.getElementById('timelinePanel');
  var now = new Date();
  var steps = TL_STEPS.map(function(s) {
    var state = 'wait', time = '';
    if (phase === 'uploading') {
      if (s.id === 'upload') { state = 'active'; time = fmtTime(uploadStart); }
    } else if (phase === 'upload_failed') {
      if (s.id === 'upload') { state = 'fail'; time = fmtTime(uploadStart); }
    } else if (phase === 'uploaded') {
      if (s.id === 'upload')   { state = 'done'; time = fmtTime(uploadStart); }
      if (s.id === 'register') { state = 'done'; time = fmtTime(now); }
    } else if (phase === 'processing') {
      if (s.id === 'upload')   { state = 'done'; time = fmtTime(uploadStart); }
      if (s.id === 'register') { state = 'done'; time = sourceData ? fmtTime(sourceData.created_at) : ''; }
      if (s.id === 'convert')  { state = 'active'; }
    } else if (phase === 'units_pending') {
      // Source processing (convert) is done, but knowledge-unit extraction
      // (units_status) is a separate async queue task that only gets
      // enqueued after that — it is NOT implied by sources.status ===
      // 'completed', so this phase waits for units_status to independently
      // reach completed/failed instead of marking "units" done just because
      // the source status flipped (see sources.units_status, written by
      // unit.Service's queue handler).
      if (s.id === 'upload')   { state = 'done'; time = fmtTime(uploadStart); }
      if (s.id === 'register') { state = 'done'; time = sourceData ? fmtTime(sourceData.created_at) : ''; }
      if (s.id === 'convert')  { state = 'done'; time = sourceData ? fmtTime(sourceData.completed_at) : ''; }
      if (s.id === 'units')    { state = 'active'; }
    } else if (phase === 'semantics_pending') {
      if (s.id === 'upload')    { state = 'done'; time = fmtTime(uploadStart); }
      if (s.id === 'register')  { state = 'done'; time = sourceData ? fmtTime(sourceData.created_at) : ''; }
      if (s.id === 'convert')   { state = 'done'; time = sourceData ? fmtTime(sourceData.completed_at) : ''; }
      if (s.id === 'units')     { state = 'done'; time = sourceData ? fmtTime(sourceData.units_built_at) : ''; }
      if (s.id === 'semantics') { state = 'active'; }
    } else if (phase === 'units_failed') {
      if (s.id === 'upload')   { state = 'done'; time = fmtTime(uploadStart); }
      if (s.id === 'register') { state = 'done'; time = sourceData ? fmtTime(sourceData.created_at) : ''; }
      if (s.id === 'convert')  { state = 'done'; time = sourceData ? fmtTime(sourceData.completed_at) : ''; }
      if (sourceData && sourceData.units_stage === 'semantics') {
        if (s.id === 'units')     { state = 'done'; time = fmtTime(sourceData.units_built_at); }
        if (s.id === 'semantics') { state = 'fail'; time = fmtTime(sourceData.units_completed_at); }
      } else if (s.id === 'units') {
        state = 'fail'; time = sourceData ? fmtTime(sourceData.units_completed_at) : '';
      }
    } else if (phase === 'completed') {
      state = 'done';
      if (s.id === 'upload')   time = fmtTime(uploadStart);
      if (s.id === 'register') time = sourceData ? fmtTime(sourceData.created_at) : '';
      if (s.id === 'convert')  time = sourceData ? fmtTime(sourceData.completed_at) : '';
      if (s.id === 'units')    time = sourceData ? fmtTime(sourceData.units_built_at) : '';
      if (s.id === 'semantics') time = sourceData ? fmtTime(sourceData.units_completed_at) : '';
    } else if (phase === 'failed') {
      if (s.id === 'upload')   { state = 'done'; time = fmtTime(uploadStart); }
      if (s.id === 'register') { state = 'done'; time = sourceData ? fmtTime(sourceData.created_at) : ''; }
      if (s.id === 'convert')  { state = 'done'; time = sourceData ? fmtTime(sourceData.completed_at) : ''; }
      if (s.id === 'units')    { state = 'fail'; time = fmtTime(now); }
    }
    return { label: s.label, state: state, time: time };
  });
  panel.innerHTML = renderTimeline(title, steps, sourceData);
}

function closeSourceTimelineProgress() {
  if (S.sourceTimelineSourceId) {
    clearTimeout(S.pollTimers['tl-' + S.sourceTimelineSourceId]);
    delete S.pollTimers['tl-' + S.sourceTimelineSourceId];
  }
  if (S.sourceTimelineEventSource) S.sourceTimelineEventSource.close();
  S.sourceTimelineEventSource = null;
  S.sourceTimelineSourceId = null;
}

function scheduleSourceTimelinePoll(sourceId) {
  if (S.sourceTimelineSourceId !== sourceId) return;
  clearTimeout(S.pollTimers['tl-' + sourceId]);
  S.pollTimers['tl-' + sourceId] = setTimeout(function() { showTimelineForSource(sourceId, true); }, 3000);
}

function renderPersistedSourceTimeline(sourceId, d) {
  var panel = document.getElementById('timelinePanel');
  var steps = buildStepsFromSource(d);
  var errHtml = d.error_msg ? '<div style="margin-top:8px;font-size:11px;color:var(--red);padding:6px 8px;background:var(--red-lt);border-radius:var(--radius-xs)">' + esc(d.error_msg) + '</div>' : '';
  panel.innerHTML = renderTimeline(d.title || d.source_id, steps, d) + errHtml;

  // Keep polling until BOTH source processing and knowledge-unit extraction
  // are done — sources.status alone only covers the former (see
  // buildStepsFromSource / sources.units_status).
  var unitsSettled = d.units_status === 'completed' || d.units_status === 'failed';
  if (d.status === 'processing' || d.status === 'pending' || (d.status === 'completed' && !unitsSettled)) {
    scheduleSourceTimelinePoll(sourceId);
  } else {
    // Reached a terminal state (status=failed, or status=completed with
    // units settled) — the 来源列表 badge (sourceDisplayStatus) is driven by
    // this same status/units_status pair, so it needs the same refresh
    // pollSourceTimeline already does for the just-uploaded path. Without
    // this, viewing an existing card's timeline via SSE/showTimelineForSource
    // (as opposed to the immediate post-upload poll) never updates the list.
    loadSources();
    if (S.sourceTimelineSourceId === sourceId) closeSourceTimelineProgress();
  }
}

function subscribeSourceTimelineProgress(sourceId) {
  closeSourceTimelineProgress();
  S.sourceTimelineSourceId = sourceId;
  var stream = new EventSource(S.baseUrl + '/sources/' + encodeURIComponent(sourceId) + '/progress');
  S.sourceTimelineEventSource = stream;

  function ownsSourceTimelineStream() {
    return S.sourceTimelineEventSource === stream && S.sourceTimelineSourceId === sourceId;
  }

  function refreshPersistedTimeline() {
    if (!ownsSourceTimelineStream()) return;
    stream.close();
    if (S.sourceTimelineEventSource === stream) S.sourceTimelineEventSource = null;
    showTimelineForSource(sourceId, true);
  }

  stream.addEventListener('progress', function(e) {
    if (!ownsSourceTimelineStream()) return;
    var evt;
    try { evt = JSON.parse(e.data); } catch (_) { return; }
    if (evt.step === 'unit_semantics' && (evt.status === 'started' || evt.status === 'progress')) {
      var requestGeneration = ++S.sourceTimelineRequestGeneration;
      api('GET', '/sources/' + sourceId).then(function(r) {
        if (!ownsSourceTimelineStream() || requestGeneration !== S.sourceTimelineRequestGeneration) return;
        if (!r.ok || !r.data) { scheduleSourceTimelinePoll(sourceId); return; }
        renderPersistedSourceTimeline(sourceId, r.data);
      }).catch(function() {
        if (!ownsSourceTimelineStream() || requestGeneration !== S.sourceTimelineRequestGeneration) return;
        scheduleSourceTimelinePoll(sourceId);
      });
    } else if ((evt.step === 'unit_semantics' && evt.status === 'completed') || evt.step === 'done') {
      refreshPersistedTimeline();
    }
  });
  stream.addEventListener('done', refreshPersistedTimeline);
}

function showTimelineForSource(sourceId, isRefresh) {
  if (isRefresh && S.sourceTimelineSourceId !== sourceId) return;
  var requestGeneration = ++S.sourceTimelineRequestGeneration;
  if (!isRefresh) {
    S.sourceTimelineUploadGeneration++;
    if (S.sourceTimelineUploadSourceId) {
      clearTimeout(S.pollTimers[S.sourceTimelineUploadSourceId]);
      delete S.pollTimers[S.sourceTimelineUploadSourceId];
      S.sourceTimelineUploadSourceId = null;
    }
    subscribeSourceTimelineProgress(sourceId);
  }
  if (S.sourceTimelineSourceId !== sourceId) return;
  var panel = document.getElementById('timelinePanel');
  panel.innerHTML = '<div class="tl-empty">加载中...</div>';
  document.querySelectorAll('.source-card').forEach(function(c) { c.classList.remove('active'); });
  var card = document.getElementById('sc-' + sourceId);
  if (card) card.classList.add('active');

  api('GET', '/sources/' + sourceId).then(function(r) {
    if (requestGeneration !== S.sourceTimelineRequestGeneration || S.sourceTimelineSourceId !== sourceId) return;
    if (!r.ok || !r.data) { panel.innerHTML = '<div class="tl-empty">加载失败</div>'; scheduleSourceTimelinePoll(sourceId); return; }
    renderPersistedSourceTimeline(sourceId, r.data);
  }).catch(function() {
    if (requestGeneration !== S.sourceTimelineRequestGeneration || S.sourceTimelineSourceId !== sourceId) return;
    panel.innerHTML = '<div class="tl-empty">加载失败</div>';
    scheduleSourceTimelinePoll(sourceId);
  });
}

function buildStepsFromSource(d) {
  return TL_STEPS.map(function(s) {
    var state = 'wait', time = '';
    if (s.id === 'upload') {
      state = 'done';
      time = fmtTime(d.created_at);
    } else if (s.id === 'register') {
      state = 'done';
      time = fmtTime(d.created_at);
    } else if (s.id === 'convert') {
      if (d.status === 'pending') { state = 'wait'; }
      else if (d.status === 'processing') { state = 'active'; time = fmtTime(d.processing_started_at); }
      else { state = 'done'; time = fmtTime(d.completed_at); }
    } else if (s.id === 'units') {
      if (d.status !== 'completed') { state = 'wait'; }
      else if (d.units_status === 'completed') { state = 'done'; time = fmtTime(d.units_built_at || d.units_completed_at); }
      else if (d.units_status === 'failed' && d.units_stage !== 'semantics') { state = 'fail'; time = fmtTime(d.units_completed_at); }
      else if (d.units_stage === 'semantics') { state = 'done'; time = fmtTime(d.units_built_at); }
      else { state = 'active'; }
    } else if (s.id === 'semantics') {
      if (d.status !== 'completed') { state = 'wait'; }
      else if (d.units_status === 'completed') { state = 'done'; time = fmtTime(d.units_completed_at); }
      else if (d.units_status === 'failed' && d.units_stage === 'semantics') { state = 'fail'; time = fmtTime(d.units_completed_at); }
      else if (d.units_stage === 'semantics') { state = 'active'; }
      else { state = 'wait'; }
    }
    return { label: s.label, state: state, time: time };
  });
}

function renderTimeline(title, steps, sourceData) {
  var html = '<div class="timeline"><div class="timeline-title"><span class="tl-name">' + esc(title) + '</span>';
  if (sourceData && sourceData.source_id) html += '<button class="copy-btn" onclick="event.stopPropagation();copy(\'' + esc(sourceData.source_id) + '\',this)">ID</button>';
  html += '</div>';
  steps.forEach(function(s, i) {
    var dotCls = 'tl-dot' + (s.state !== 'wait' ? ' ' + s.state : '');
    var lineDone = (s.state === 'done' || s.state === 'active') ? ' done' : '';
    var labelCls = s.state === 'wait' ? ' wait' : '';
    html += '<div class="tl-step">\
      <div class="tl-rail"><div class="' + dotCls + '"></div><div class="tl-line' + lineDone + '"></div></div>\
      <div class="tl-body"><div class="tl-label' + labelCls + '">' + esc(s.label) + '</div>' +
      (s.time ? '<div class="tl-time">' + esc(s.time) + '</div>' : '') +
      '</div></div>';
  });
  html += '</div>';
  if (sourceData && sourceData.message) {
    html += '<div style="margin-top:8px;font-size:11px;color:var(--red);padding:6px 8px;background:var(--red-lt);border-radius:var(--radius-xs)">' + esc(sourceData.message) + '</div>';
  }
  return html;
}

function fmtTime(t) {
  if (!t) return '';
  try {
    var d = t instanceof Date ? t : new Date(t);
    return d.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  } catch(e) { return ''; }
}

// sources.status only reflects source processing (parse/outline) — knowledge
// -unit extraction is a separate async queue task enqueued right after that,
// tracked independently in sources.units_status (pending -> processing ->
// completed/failed, written by unit.Service's queue handler). Both must have
// reached a terminal state before this timeline shows the source as fully
// done — otherwise "已完成"/"处理完毕" is shown while units are still (or
// haven't even started) being extracted, which is the bug this guards against.
function timelinePhaseFromSource(d) {
  var status = (d && d.status) || 'unknown';
  var unitsStatus = (d && d.units_status) || 'pending';
  if (status === 'failed') return 'failed';
  if (status !== 'completed') return 'processing';
  if (unitsStatus === 'completed') return 'completed';
  if (unitsStatus === 'failed') return 'units_failed';
  return ((d && d.units_stage) || 'pending') === 'semantics' ? 'semantics_pending' : 'units_pending';
}

async function pollSourceTimeline(sourceId, title, uploadStart, uploadGeneration) {
  clearTimeout(S.pollTimers[sourceId]);
  if (uploadGeneration !== S.sourceTimelineUploadGeneration) return;
  S.sourceTimelineUploadSourceId = sourceId;
  try {
    var r = await api('GET', '/sources/' + sourceId);
    if (uploadGeneration !== S.sourceTimelineUploadGeneration || (S.sourceTimelineSourceId && S.sourceTimelineSourceId !== sourceId)) {
      if (S.sourceTimelineUploadSourceId === sourceId) S.sourceTimelineUploadSourceId = null;
      return;
    }
    var phase = timelinePhaseFromSource(r.data);
    showTimeline(title, phase, r.data, uploadStart);
    if (phase === 'failed' || phase === 'completed' || phase === 'units_failed') {
      if (uploadGeneration === S.sourceTimelineUploadGeneration && S.sourceTimelineUploadSourceId === sourceId) S.sourceTimelineUploadSourceId = null;
      loadSources();
      return;
    }
  } catch(e) { /* ignore */ }
  if (uploadGeneration !== S.sourceTimelineUploadGeneration || S.sourceTimelineUploadSourceId !== sourceId || (S.sourceTimelineSourceId && S.sourceTimelineSourceId !== sourceId)) return;
  S.pollTimers[sourceId] = setTimeout(function() { pollSourceTimeline(sourceId, title, uploadStart, uploadGeneration); }, 3000);
}

// 文件列表内联知识领域下拉（PATCH /sources/:id/domain）：域分类器判错域时人工纠正，
// 不用等重新上传，见 preset/domains.json 域定义 + 用户 2026-07-16 反馈。
function sourceDomainSelectHtml(s) {
  var opts = '<option value="">未分类</option>' + S.allDomains.map(function(d) {
    return '<option value="' + esc(d.domain_id) + '"' + (d.domain_id === s.domain_id ? ' selected' : '') + '>' + esc(d.name) + '</option>';
  }).join('');
  return '<select class="badge" style="background:var(--bg-3);color:var(--text-2);border:none;cursor:pointer" onclick="event.stopPropagation()" onchange="event.stopPropagation();updateSourceDomain(\'' + esc(s.source_id) + '\',this)">' + opts + '</select>';

async function updateSourceDomain(sourceId, selectEl) {
  var domainId = selectEl.value;
  var statusEl = document.getElementById('sd-status-' + sourceId);
  if (statusEl) statusEl.textContent = '保存中...';
  try {
    var r = await api('PATCH', '/sources/' + sourceId + '/domain', { domain_id: domainId });

  } catch(e) {
    if (statusEl) statusEl.textContent = '保存失败';
  }

}

var sourcePage = 0;
var sourcePageSize = 10;
async function loadSources() {
  var filter = document.getElementById('sourceStatusFilter')?.value || '';
  var domainFilter = document.getElementById('sourceDomainFilter')?.value || '';
  var list = document.getElementById('sourcesList');
  if (!list) return;
  list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:12px">加载中...</div>';
  try {
    var params = 'limit=' + sourcePageSize + '&offset=' + (sourcePage * sourcePageSize);
    if (filter) params += '&status=' + filter;
    if (domainFilter) params += '&domain_id=' + domainFilter;
    var r = await api('GET', '/sources?' + params);
    var body = r.data || {};
    var src = Array.isArray(body.items) ? body.items : (Array.isArray(body) ? body : []);
    var total = body.total != null ? body.total : src.length;
    var totalPages = Math.ceil(total / sourcePageSize) || 1;
    var countEl = document.getElementById('sourcesCount');
    if (countEl) countEl.textContent = '(' + total + ')';
    // update domain filter options
    if (Array.isArray(body.domains)) S.allDomains = body.domains;
    var domainSel = document.getElementById('sourceDomainFilter');
    if (domainSel && body.domains) {
      var curVal = domainSel.value;
      domainSel.innerHTML = '<option value="">全部领域</option>' + body.domains.map(function(d) {
        return '<option value="' + esc(d.domain_id) + '"' + (d.domain_id === curVal ? ' selected' : '') + '>' + esc(d.name) + '</option>';
      }).join('');
    }
    // update pager
    var pager = document.getElementById('sourcesPager');
    if (pager) {
      pager.style.display = totalPages > 1 ? 'flex' : 'none';
      document.getElementById('srcPageInfo').textContent = (sourcePage + 1) + ' / ' + totalPages;
      document.getElementById('srcPrevBtn').disabled = sourcePage <= 0;
      document.getElementById('srcNextBtn').disabled = sourcePage >= totalPages - 1;
    }
    if (!src.length) { list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-3);font-size:13px">暂无来源</div>'; return; }
    list.innerHTML = src.map(function(s) {
      return '<div class="source-card" id="sc-' + esc(s.source_id) + '" onclick="showTimelineForSource(\'' + esc(s.source_id) + '\')"><div class="sc-title">' + esc(s.title || s.source_id) + '</div><div class="sc-meta">\
        <span class="status-chip status-' + (sourceDisplayStatus(s) || 'unknown') + '">' + statusLabel(sourceDisplayStatus(s)) + '</span>\
        <span class="badge">' + esc(s.format || '') + '</span>\
        ' + sourceDomainSelectHtml(s) + '\
        <span id="sd-status-' + esc(s.source_id) + '" style="font-size:10px;color:var(--text-3)"></span>\
        <span style="font-size:10px;color:var(--text-3)">' + dateStr(s.created_at) + '</span>\
      </div><div class="sc-actions">\
        <button class="btn btn-sm" onclick="viewSource(\'' + esc(s.source_id) + '\')">详情</button>\
        ' + (s.status==='completed' ? '<button class="btn btn-sm" onclick="window.open(S.baseUrl+\'/sources/' + esc(s.source_id) + '/preview\',\'_blank\')">预览</button>' : '') + '\
        ' + (sourceDisplayStatus(s)==='completed' ? '<button class="btn btn-sm" onclick="event.stopPropagation();reuploadSource(\'' + esc(s.source_id) + '\')">重新上传</button>' : '') + '\
        ' + (sourceDisplayStatus(s)==='completed' ? '<button class="btn btn-sm" style="color:var(--red)" onclick="event.stopPropagation();deleteSource(\'' + esc(s.source_id) + '\',false)">删除</button>' : '') + '\
        ' + (sourceDisplayStatus(s)==='failed' ? '<button class="btn btn-sm" onclick="event.stopPropagation();retrySource(\'' + esc(s.source_id) + '\')">重试</button>' : '') + '\
        ' + (sourceDisplayStatus(s)==='failed' ? '<button class="btn btn-sm" style="color:var(--red)" onclick="event.stopPropagation();deleteSource(\'' + esc(s.source_id) + '\',true)">删除</button>' : '') + '\
        ' + (s.status==='deleted' ? '<button class="btn btn-sm" style="color:var(--green)" onclick="event.stopPropagation();restoreSource(\'' + esc(s.source_id) + '\')">恢复</button>' : '') + '\
        <button class="copy-btn" onclick="event.stopPropagation();copy(\'' + esc(s.source_id) + '\',this)">复制ID</button>\
      </div></div>';
    }).join('');
  } catch(e) { list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--red);font-size:12px">加载失败</div>'; }
}

async function saveSourceSummary(sourceId) {

// 覆盖率校验（手动触发，GET /sources/:id/coverage）：按 segment 比对已提取
// 知识单元的行范围，标出原文中没有被任何知识单元覆盖的行（见 internal/unit/coverage.go）。
async function verifyCoverage(sourceId) {
  var el = document.getElementById('sourceCoverageResult');
  if (!el) return;
  el.innerHTML = '<h3 style="margin-top:14px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">覆盖率校验</h3><div style="margin-top:8px;font-size:12px;color:var(--text-3)">校验中...</div>';
  try {
    var r = await api('GET', '/sources/' + sourceId + '/coverage');
    if (!r.ok) { el.innerHTML = '<h3 style="margin-top:14px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">覆盖率校验</h3><div style="margin-top:8px;font-size:12px;color:var(--red)">校验失败</div>'; return; }
    var d = r.data || {};
    var total = d.total_lines || 0;
    var covered = d.covered_lines || 0;
    var ratio = total ? (100 * covered / total) : 100;
    var ratioStyle = ratio >= 90 ? 'background:var(--green-lt);border-color:var(--green);color:var(--green)'
      : (ratio >= 70 ? 'background:var(--yellow-lt);border-color:var(--yellow);color:var(--yellow)'
      : 'background:var(--red-lt);border-color:var(--red);color:var(--red)');
    var segs = Array.isArray(d.segments) ? d.segments : [];
    var flagged = segs.filter(function(s) { return (s.gaps && s.gaps.length) || s.has_extraction_failed; });

    var html = '<h3 style="margin-top:14px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">覆盖率校验</h3>';
    html += '<div style="margin-top:8px;font-size:12px;display:flex;align-items:center;gap:8px">总行数 ' + total + '，覆盖 ' + covered + ' 行 <span class="badge" style="' + ratioStyle + '">' + ratio.toFixed(1) + '%</span></div>';
    html += '<div style="margin-top:12px;font-size:12px;font-weight:600;color:var(--text-2)">未覆盖内容</div>';
    if (!flagged.length) {
      html += '<div style="margin-top:6px;font-size:12px;color:var(--green)">未发现缺口</div>';
    } else {
      html += '<div style="margin-top:6px">' + flagged.map(function(s) {
        var failedTag = s.has_extraction_failed ? '<span class="badge gap" style="margin-left:6px">提取失败</span>' : '';
        var gapsHtml = (s.gaps || []).map(function(g) {
          var gid = 'gapfix-' + g.line_start + '-' + g.line_end;
          return '<div id="' + gid + '-row" style="padding:2px 0 2px 10px;color:var(--text-3);display:flex;align-items:center;gap:8px">\
            <span style="flex:1">L' + g.line_start + '-L' + g.line_end + '：' + esc(g.preview || '') + '</span>\
            <button class="btn btn-sm" id="' + gid + '-btn" onclick="fixCoverageGap(\'' + esc(sourceId) + '\',' + g.line_start + ',' + g.line_end + ',\'' + gid + '\')">修复</button>\
            <button class="btn btn-sm" id="' + gid + '-prev-btn" onclick="mergeCoverageGap(\'' + esc(sourceId) + '\',' + g.line_start + ',' + g.line_end + ',\'prev\',\'' + gid + '\')">向上合并</button>\
            <button class="btn btn-sm" id="' + gid + '-next-btn" onclick="mergeCoverageGap(\'' + esc(sourceId) + '\',' + g.line_start + ',' + g.line_end + ',\'next\',\'' + gid + '\')">向下合并</button>\
          </div>';
        }).join('');
        return '<div style="padding:5px 0;border-bottom:1px solid var(--border-lt);font-size:12px">\
          <span>' + esc(s.outline_title || '') + ' (L' + s.line_start + '-L' + s.line_end + ', ' + s.covered_lines + '/' + s.total_lines + ')</span>' + failedTag + gapsHtml + '\
        </div>';
      }).join('') + '</div>';
    }
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<h3 style="margin-top:14px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">覆盖率校验</h3><div style="margin-top:8px;font-size:12px;color:var(--red)">校验失败：' + esc(e.message) + '</div>'; }
}

// 手动修复覆盖率缺口（POST /sources/:id/coverage/fix）：把这段没被任何知识
// 单元覆盖的原文当一个知识单元，重新提取知识点+语义（不重新做边界切分判断），
// 成功则作为新知识单元写入，不影响其余已有知识单元；成功/失败后都重新校验一次
// 覆盖率，让列表反映最新状态。
async function fixCoverageGap(sourceId, lineStart, lineEnd, gid) {
  var btn = document.getElementById(gid + '-btn');
  if (btn) { btn.disabled = true; btn.textContent = '修复中...'; }
  try {
    var r = await api('POST', '/sources/' + sourceId + '/coverage/fix', { line_start: lineStart, line_end: lineEnd });
    if (r.ok) {
      verifyCoverage(sourceId);
      loadSourceUnits(sourceId);
    } else {
      alert('修复失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
      if (btn) { btn.disabled = false; btn.textContent = '修复'; }
    }
  } catch(e) {
    alert('修复出错：' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '修复'; }
  }
}

// 手动合并覆盖率缺口（POST /sources/:id/coverage/merge）：把这段零碎内容
// （如单行的 /etc/hosts 条目，本身不构成独立知识点）并入相邻知识单元的行区间，
// 不新建知识点、不调用模型——和自动提取阶段的缺口合并（predup.go
// mergeGapIntoNeighborInMemory）是同一套逻辑，只是这里手动选方向。合并前先
// GET merge-target 查出目标知识单元的内容，弹窗给用户确认，避免误合并到不相关
// 的相邻单元——这一步之后没有再校正的机会（目标单元的 center/points 不会重算）。
async function mergeCoverageGap(sourceId, lineStart, lineEnd, direction, gid) {
  var fixBtn = document.getElementById(gid + '-btn');
  var prevBtn = document.getElementById(gid + '-prev-btn');
  var nextBtn = document.getElementById(gid + '-next-btn');
  var btn = direction === 'prev' ? prevBtn : nextBtn;
  var dirLabel = direction === 'prev' ? '向上合并' : '向下合并';
  var reset = function(label) {
    [fixBtn, prevBtn, nextBtn].forEach(function(b) { if (b) b.disabled = false; });
    if (btn) btn.textContent = label;
  };

  [fixBtn, prevBtn, nextBtn].forEach(function(b) { if (b) b.disabled = true; });
  if (btn) btn.textContent = '查询中...';
  try {
    var q = '?line_start=' + lineStart + '&line_end=' + lineEnd + '&direction=' + direction;
    var pr = await api('GET', '/sources/' + sourceId + '/coverage/merge-target' + q);
    if (!pr.ok) {
      alert('查询相邻知识单元失败：' + (pr.data && pr.data.message ? pr.data.message : JSON.stringify(pr.data)));
      reset(dirLabel);
      return;
    }
    var t = pr.data;
    var msg = '将把 L' + lineStart + '-L' + lineEnd + ' 合并到以下知识单元（合并后不会重新生成该单元的知识点/语义）：\n\n'
      + t.center + '（L' + t.line_start + '-L' + t.line_end + '）\n\n' + t.content + '\n\n确认合并？';
    if (!(await showConfirm(msg))) { reset(dirLabel); return; }

    if (btn) btn.textContent = '合并中...';
    var r = await api('POST', '/sources/' + sourceId + '/coverage/merge', { line_start: lineStart, line_end: lineEnd, direction: direction });
    if (r.ok) {
      verifyCoverage(sourceId);
      loadSourceUnits(sourceId);
    } else {
      alert('合并失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
      reset(dirLabel);
    }
  } catch(e) {
    alert('合并出错：' + e.message);
    reset(dirLabel);
  }
}

async function retrySource(sourceId) {
  try {
    var r = await api('POST', '/sources/' + sourceId + '/retry');
    if (r.ok) loadSources();
    else alert('重试失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('重试出错：' + e.message); }
}

// isFailed 决定确认文案：失败文件是彻底删除，其余状态走逻辑删除（保留原文件与
// 记录，仅将已提取知识标记为 deprecated，可追溯），后端按当前 status 自动分派。
async function deleteSource(sourceId, isFailed) {
  var msg = isFailed
    ? '确定彻底删除此失败文件？此操作不可恢复。'
    : '确定删除此文件？已提取的知识将标记为失效（逻辑删除），原文件仍会保留以便追溯。';
  if (!(await showConfirm(msg))) return;
  try {
    var r = await api('DELETE', '/sources/' + sourceId);
    if (r.ok) {
      document.getElementById('timelinePanel').innerHTML = '<div class="tl-empty">选择右侧文件查看处理过程</div>';
      loadSources();
    } else {
      alert('删除失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
    }
  } catch(e) { alert('删除出错：' + e.message); }
}

async function restoreSource(sourceId) {
  if (!(await showConfirm('确定恢复此文件？已提取的知识点会恢复到删除前的状态（原本已被替代的部分仍保持替代状态）。'))) return;
  try {
    var r = await api('POST', '/sources/' + sourceId + '/restore');
    if (r.ok) {
      loadSources();
    } else {
      alert('恢复失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
    }
  } catch(e) { alert('恢复出错：' + e.message); }
}

// KU 本体（center/行号/正文）是提取产物，只读；人工修正权落在 rerank 语义

var kuSemanticsUnitId = null;

var KU_POINT_TYPES = [

function pointTypeLabel(t) {

}

    </div>';
  }

  content.innerHTML = '<h2>知识单元语义 ' + (sem.manually_edited ? '<span title="人工修正过">✍️</span>' : '') + '</h2>\
    <div style="font-size:12px;margin-bottom:14px">\
      <div style="display:flex;gap:14px;color:var(--text-2);margin-bottom:6px">\
        <span>中心句：<b style="color:var(--text-1)">' + esc(u.center || '') + '</b></span>\
        <span>L' + u.line_start + '-L' + u.line_end + '</span>\
        ' + lifecycleBadgeHtml(u.lifecycle) + '\
      </div>\
      ' + (u.outline_path ? '<div style="color:var(--text-2);margin-bottom:6px">所属目录：' + esc(u.outline_path) + (u.outline_node_type ? ' <span class="badge">' + esc(u.outline_node_type) + '</span>' : '') + '</div>' : '') + '\
      <div style="max-height:180px;overflow:auto;background:var(--bg-2);border:1px solid var(--border-lt);border-radius:4px;padding:8px;white-space:pre-wrap;font-family:monospace;font-size:11px;color:var(--text-2)">' + esc(u.content || '') + '</div>\
      <div style="color:var(--text-3);margin-top:4px">KU 内容与字段为提取产物，只读；下方 rerank 语义可编辑，检索的证据分类（rerank_judge）依据语义字段与知识点判断。</div>\
    </div>\
    ' + (missing ? '<div style="font-size:12px;color:var(--red);margin-bottom:10px">该 KU 无语义记录，被召回将导致检索报错——请补写后保存。</div>' : '') + '\
    ' + fieldRow('内容主题', 'kuSemContentTheme', sem.content_theme)
      + fieldRow('意图', 'kuSemIntent', sem.intent)
      + fieldRow('对象', 'kuSemObject', sem.object)
      + fieldRow('范围', 'kuSemScope', sem.scope)
      + fieldRow('来源主题', 'kuSemSourceTheme', sem.source_theme) + '\
    <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;margin-top:14px">\
      <label style="width:110px;font-size:12px;color:var(--text-2);flex-shrink:0;padding-top:5px">知识点</label>\
      <div id="kuSemPoints" style="flex:1"></div>\
    </div>\
    <div style="font-size:11px;color:var(--text-3);margin-left:118px">检索靠知识点匹配问题——把「问题会怎么问」对应的具体规则/数字逐字补进来（如“不跨年累计，次年清零”）。已有知识点为提取产物，只可新增补漏，不可修改。</div>\
    ' + (sem.edited_at ? '<div style="font-size:11px;color:var(--text-3);margin-top:6px">最近人工修正：' + dateStr(sem.edited_at) + '</div>' : '') + '\

// 知识点列表：已有 KP 只读展示（✍️ 标记人工新增的），底部一行新增表单。
async function loadKuPoints(unitId) {
  var el = document.getElementById('kuSemPoints');
  if (!el) return;
  el.innerHTML = '<div style="font-size:12px;color:var(--text-3)">加载中…</div>';
  var r = await api('GET', '/units/' + unitId + '/points');
  if (kuSemanticsUnitId !== unitId || !document.getElementById('kuSemPoints')) return;
  var points = (r.ok && Array.isArray(r.data)) ? r.data : [];
  renderKuPoints(points);
}

function renderKuPoints(points) {
  var el = document.getElementById('kuSemPoints');
  if (!el) return;
  var rows = points.filter(function(p){ return p.lifecycle === 'current'; }).map(function(p) {
    return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">\
      <span class="badge" style="flex-shrink:0">' + esc(pointTypeLabel(p.point_type)) + '</span>\
      <span style="flex:1;font-size:12px;color:var(--text-1);padding:5px 8px;border:1px solid var(--border-lt);border-radius:4px;background:var(--bg-2)">' + esc(p.content) + '</span>\
      ' + (p.manually_edited ? '<span title="人工新增" style="flex-shrink:0">✍️</span>' : '') + '\
    </div>';
  }).join('');
  el.innerHTML = (rows || '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px">（无知识点）</div>') + '\
    <div style="display:flex;gap:6px;margin-top:4px">\
      <select id="kuNewPointType" style="flex-shrink:0;padding:5px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--bg)">' +
        KU_POINT_TYPES.map(function(pt){ return '<option value="' + pt.value + '"' + (pt.value === 'rule' ? ' selected' : '') + '>' + pt.label + '</option>'; }).join('') + '\
      </select>\
      <input id="kuNewPointContent" placeholder="新增知识点内容" style="flex:1;padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--bg)" />\
      <button class="btn btn-sm" id="kuNewPointBtn" onclick="addKuPoint()">＋ 新增</button>\
    </div>';
}

async function addKuPoint() {
  var contentInput = document.getElementById('kuNewPointContent');
  var typeSelect = document.getElementById('kuNewPointType');
  var btn = document.getElementById('kuNewPointBtn');
  var content = contentInput.value.trim();
  if (!content) { alert('知识点内容不能为空'); return; }

  btn.disabled = true;
  btn.textContent = '分析中…'; // 新增后同步跑增量 KPN，可能需要几秒
  var r = await api('POST', '/units/' + kuSemanticsUnitId + '/points', { content: content, point_type: typeSelect.value });
  if (r.ok) {
    var n = (r.data && r.data.relations_created) || 0;
    await loadKuPoints(kuSemanticsUnitId);
    if (n > 0) {
      var el = document.getElementById('kuSemPoints');
      if (el) { el.insertAdjacentHTML('beforeend', '<div style="font-size:11px;color:var(--green,#2da44e);margin-top:4px">已新增，关联出 ' + n + ' 条新关系</div>'); }
    }
  } else {
    btn.disabled = false;
    btn.textContent = '＋ 新增';
    alert('新增失败：' + ((r.data && r.data.error) || r.status));
  }
}

async function saveKuSemantics() {
  var body = { semantics: {
    content_theme: document.getElementById('kuSemContentTheme').value.trim(),
    intent:        document.getElementById('kuSemIntent').value.trim(),
    object:        document.getElementById('kuSemObject').value.trim(),
    scope:         document.getElementById('kuSemScope').value.trim(),
    source_theme:  document.getElementById('kuSemSourceTheme').value.trim()
  }};
  var missingField = ['content_theme','intent','object','scope','source_theme'].find(function(k){ return !body.semantics[k]; });
  if (missingField) { alert('所有语义字段均不能为空'); return; }

  var r = await api('PUT', '/units/' + kuSemanticsUnitId + '/semantics', body);
  if (r.ok) { closeKuSemantics(); }
  else { alert('保存失败：' + ((r.data && r.data.error) || r.status)); }
}

function closeKuSemantics() {
  document.getElementById('kuSemanticsModal').classList.add('hidden');
  kuSemanticsUnitId = null;
}

var reuploadTargetId = null;
async function reuploadSource(sourceId) {
  // Shadow Source 重传产生全新 KU，人工修正过的 rerank 语义随原 KU 一起失效
  // （docs/impl/v1/semantics-curation.md），重传前明确告知。
  try {
    var r = await api('GET', '/sources/' + sourceId);
    var n = r.ok && r.data ? (r.data.manually_edited_count || 0) : 0;
    if (n > 0 && !(await showConfirm('该文档下有 ' + n + ' 条人工修正的语义将随重新上传失效（新文件会重新提取知识单元）。继续？'))) return;
  } catch(e) { /* 查询失败不拦截重传 */ }
  reuploadTargetId = sourceId;
  document.getElementById('reuploadFileInput').click();
}

async function onReuploadFileSelected(e) {
  var file = e.target.files[0];
  e.target.value = '';
  var sourceId = reuploadTargetId;
  reuploadTargetId = null;
  if (!file || !sourceId) return;

  var title = '重新上传：' + file.name;
  var uploadStart = new Date();
  showTimeline(title, 'uploading', null, uploadStart);

  var fd = new FormData();
  fd.append('file', file);
  try {
    var r = await api('POST', '/sources/' + sourceId + '/reupload', fd, true);
    if (r.ok && r.data && r.data.shadow_source_id) {
      showTimeline(title, 'uploaded', null, uploadStart);
      pollReuploadTimeline(r.data.shadow_source_id, title, uploadStart);
    } else {
      showTimeline(title, 'upload_failed', r.data, uploadStart);
    }
  } catch(err) {
    showTimeline(title, 'upload_failed', null, uploadStart);
  }
  loadSources();
}

// 影子 Source 换血成功后其行会被删除（见 lifecycle.md 步骤 2），所以轮询时
// 404 视为成功完成，而不是异常；status=failed 则是影子自身处理失败。
async function pollReuploadTimeline(shadowId, title, uploadStart) {
  clearTimeout(S.pollTimers[shadowId]);
  try {
    var r = await api('GET', '/sources/' + shadowId);
    if (r.status === 404) {
      showTimeline(title, 'completed', null, uploadStart);
      loadSources();
      return;
    }
    var status = (r.data && r.data.status) || 'unknown';
    if (status === 'failed') { showTimeline(title, 'failed', r.data, uploadStart); loadSources(); return; }
    showTimeline(title, 'processing', r.data, uploadStart);
  } catch(e) { /* ignore, retry */ }
  S.pollTimers[shadowId] = setTimeout(function() { pollReuploadTimeline(shadowId, title, uploadStart); }, 3000);
}

var LLM_PURPOSES = ['default', 'reasoning', 'extraction', 'classification'];
var LLM_PURPOSE_LABELS = {
  default: '默认',
  reasoning: '推理',
  extraction: '提取',
  classification: '分类'
};
function llmPurposeLabel(purpose) {
  return LLM_PURPOSE_LABELS[purpose] || purpose;
}
function llmPlatformLabel(platformId) {
  var p = (llmState.platforms || []).find(function(x) { return x.id === platformId; });
  return p ? p.label : platformId;
}
var llmState = { providers: [], bindings: {}, platforms: [], editingId: null, openPurposes: {} };

function openLlmView() {
  document.getElementById('llmDrawer').classList.add('open');
  document.getElementById('llmOverlay').classList.remove('hidden');
  // 每次打开都从全收起状态开始——用途绑定条目多起来后一次性全展开会很长，
  // 需要哪个用途再点开哪个。
  llmState.openPurposes = {};
  llmState.editingId = null;
  loadLlmSettings();
}
function closeLlmView() {
  document.getElementById('llmDrawer').classList.remove('open');
  document.getElementById('llmOverlay').classList.add('hidden');
}

async function loadLlmSettings() {
  var body = document.getElementById('llmBody');
  body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-3)">加载中...</div>';
  try {
    llmState.platforms = await llmApi('GET', '/llm/platforms') || [];
    llmState.providers = await llmApi('GET', '/llm/providers') || [];
    llmState.bindings = await llmApi('GET', '/llm/bindings') || {};
    if (!Array.isArray(llmState.providers)) llmState.providers = [];
    if (!Array.isArray(llmState.platforms)) llmState.platforms = [];
    renderLlmSettings();
  } catch (e) {
    body.innerHTML = '<div style="color:var(--red)">加载失败: ' + esc(e.message) + '</div>';
  }
}

async function llmApi(method, path, body) {
  var r = await api(method, path, body);
  if (!r.ok) {
    var msg = (r.data && r.data.message) ? r.data.message : ('HTTP ' + r.status);
    throw new Error(msg);
  }
  return r.data;
}

function toast(msg, isError) {
  var el = document.getElementById('appToast');
  if (!el) {
    alert(msg);
    return;
  }
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.remove('hidden');
  if (toast._hideTimer) clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(function() { el.classList.add('hidden'); }, 4000);
}

function bindLlmDrawerActions(root) {
  if (!root) return;
  root.querySelectorAll('[data-llm-test]').forEach(function(btn) {
    btn.onclick = function() { testLlmProvider(btn.getAttribute('data-llm-test'), btn); };
  });
  root.querySelectorAll('[data-llm-edit]').forEach(function(btn) {
    btn.onclick = function() { toggleEditLlmProvider(btn.getAttribute('data-llm-edit')); };
  });
  root.querySelectorAll('[data-llm-delete]').forEach(function(btn) {
    btn.onclick = function() { deleteLlmProvider(btn.getAttribute('data-llm-delete')); };
  });
}

function bindingSlot(raw) {
  if (!raw || typeof raw === 'string') {
    return { provider_id: raw || '', model: '', temperature: 0, input_max_tokens: 4096, output_max_tokens: 4096, enable_think: false };
  }
  return {
    provider_id: raw.provider_id || '',
    model: raw.model || '',
    temperature: raw.temperature != null ? raw.temperature : 0,
    input_max_tokens: raw.input_max_tokens != null ? raw.input_max_tokens : 4096,
    output_max_tokens: raw.output_max_tokens != null ? raw.output_max_tokens : 4096,
    enable_think: !!raw.enable_think
  };
}

function bindingSummaryHint(b) {
  if (!b.provider_id && !b.model) return '未绑定';
  var pr = (llmState.providers || []).find(function(x) { return x.provider_id === b.provider_id; });
  var name = pr ? pr.name : '';
  if (b.model) return (name ? name + ' · ' : '') + b.model;
  return name || '未配置模型';
}

function syncLlmPurposeOpenState() {
  if (!llmState.openPurposes) llmState.openPurposes = {};
  LLM_PURPOSES.forEach(function(purpose) {
    var el = document.getElementById('llmPurpose_' + purpose);
    if (el) llmState.openPurposes[purpose] = el.open;
  });
}

function renderLlmSettings() {
  syncLlmPurposeOpenState();
  var body = document.getElementById('llmBody');
  var html = '<div class="panel-section"><h3>用途绑定</h3><div style="display:grid;gap:8px">';
  LLM_PURPOSES.forEach(function(purpose) {
    var b = bindingSlot(llmState.bindings[purpose]);
    var open = llmState.openPurposes && llmState.openPurposes[purpose];
    html += '<details class="llm-purpose-fold" id="llmPurpose_' + purpose + '"' + (open ? ' open' : '') + '>';
    html += '<summary><span class="llm-purpose-fold-title">' + llmPurposeLabel(purpose) + '</span>';
    html += '<span class="llm-purpose-hint">' + esc(bindingSummaryHint(b)) + '</span></summary>';
    html += '<div class="llm-purpose-fold-body">';
    html += '<div class="llm-bind-provider-row">';
    html += '<span class="llm-bind-provider-label">服务商</span>';
    html += '<select id="bind_provider_' + purpose + '" class="llm-field llm-field-bind">';
    html += '<option value="">（未绑定）</option>';
    llmState.providers.forEach(function(pr) {
      var sel = b.provider_id === pr.provider_id ? ' selected' : '';
      html += '<option value="' + esc(pr.provider_id) + '"' + sel + '>' + esc(pr.name) + '</option>';
    });
    html += '</select>';
    html += '<label class="llm-bind-think"><input type="checkbox" id="bind_think_' + purpose + '"' + (b.enable_think ? ' checked' : '') + '> 开启思考模式</label>';
    html += '</div>';
    html += modelNameField('bind', purpose, b.model);
    html += miniField('温度', 'bind_temp_' + purpose, b.temperature);
    html += miniField('输入 token 上限', 'bind_in_' + purpose, b.input_max_tokens);
    html += miniField('输出 token 上限', 'bind_out_' + purpose, b.output_max_tokens);
    html += '</div></details>';
  });
  html += '<button class="btn btn-sm" style="margin-top:8px" onclick="saveLlmBindings()">保存绑定</button></div></div>';

  html += '<div class="panel-section"><h3>模型服务商配置</h3>';
  if (!llmState.providers.length) {
    html += '<p style="color:var(--text-3)">尚无服务商，请点击「新建服务商」或从 config.yml 升级导入。</p>';
  }
  llmState.providers.forEach(function(pr) {
    var open = llmState.editingId === pr.provider_id;
    html += '<div style="border:1px solid var(--border-lt);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong>' + esc(pr.name) + '</strong>';
    html += '<div style="display:flex;gap:6px"><button type="button" class="btn btn-sm" data-llm-test="' + esc(pr.provider_id) + '">测试</button>';

// 按钮的两种状态：还没拉过列表（或当前是手动输入模式）时点击去拉取模型列表
// 并切到下拉框；已经在下拉框模式时点击切回手动输入，不重新拉取。
async function toggleLlmModelPicker(formId, purpose) {
  var inputEl = document.getElementById('llm_m_model_' + formId + '_' + purpose);
  var pickEl = document.getElementById('llm_model_pick_' + formId + '_' + purpose);
  var btnEl = document.getElementById('llm_model_toggle_' + formId + '_' + purpose);
  var statusEl = document.getElementById('llm_model_pick_status_' + formId + '_' + purpose);
  if (pickEl.style.display !== 'none') {
    pickEl.style.display = 'none';
    inputEl.style.display = '';
    if (btnEl) btnEl.textContent = '获取模型列表';
    if (statusEl) statusEl.textContent = '';
    return;
  }
  if (statusEl) statusEl.textContent = '正在获取…';
  try {
    var models;
    if (formId === '__new__') {
      var base = document.getElementById('llm_base___new__').value;
      var key = document.getElementById('llm_key___new__').value;
      var platform = document.getElementById('llm_platform___new__').value;
      models = await llmApi('POST', '/llm/models/discover', { base_url: base, api_key: key, platform: platform });
    } else if (formId === 'bind') {
      var providerId = document.getElementById('bind_provider_' + purpose).value;
      if (!providerId) {
        if (statusEl) statusEl.textContent = '请先选择服务商';
        return;
      }
      models = await llmApi('GET', '/llm/providers/' + providerId + '/models');
    } else {
      models = await llmApi('GET', '/llm/providers/' + formId + '/models');
    }
    if (!models || !models.length) {
      if (statusEl) statusEl.textContent = '未返回任何模型';
      return;
    }
    var current = inputEl.value;
    pickEl.innerHTML = models.map(function(m) {
      return '<option value="' + esc(m) + '"' + (m === current ? ' selected' : '') + '>' + esc(m) + '</option>';
    }).join('');
    inputEl.style.display = 'none';
    pickEl.style.display = '';
    if (btnEl) btnEl.textContent = '手动输入';
    if (statusEl) statusEl.textContent = '共 ' + models.length + ' 个模型';
    if (pickEl.value) applyLlmModelPick(formId, purpose);
  } catch (e) {
    if (statusEl) statusEl.textContent = '获取失败: ' + e.message;
    toast('获取模型列表失败: ' + e.message, true);
  }
}

function applyLlmModelPick(formId, purpose) {
  var pickEl = document.getElementById('llm_model_pick_' + formId + '_' + purpose);
  var inputEl = document.getElementById('llm_m_model_' + formId + '_' + purpose);
  if (pickEl && pickEl.value && inputEl) {
    inputEl.value = pickEl.value;
  }
}

}
function newLlmProvider() {
  llmState.editingId = '__new__';

function collectProviderFromForm(id) {
  return {
    name: document.getElementById('llm_name_' + id).value,
    platform: document.getElementById('llm_platform_' + id).value,
    base_url: document.getElementById('llm_base_' + id).value,
    api_key: document.getElementById('llm_key_' + id).value,
    timeout_seconds: parseInt(document.getElementById('llm_timeout_' + id).value, 10) || 120,
    max_retries: parseInt(document.getElementById('llm_retries_' + id).value, 10) || 0,
    response_format: document.getElementById('llm_rf_' + id).value
  };
}

async function saveLlmProvider(id) {
  var body = collectProviderFromForm(id);
  try {
    if (id === '__new__') {
      await llmApi('POST', '/llm/providers', body);
    } else {
      await llmApi('PUT', '/llm/providers/' + id, Object.assign({ provider_id: id }, body));
    }
    llmState.editingId = null;
    await loadLlmSettings();
    toast('配置已保存并生效');
  } catch (e) { toast('保存失败: ' + e.message, true); }
}

async function deleteLlmProvider(id) {
  if (!confirm('确定删除该服务商配置？')) return;
  try {
    await llmApi('DELETE', '/llm/providers/' + id);
    await loadLlmSettings();
    toast('已删除');
  } catch (e) { toast('删除失败: ' + e.message, true); }
}

async function saveLlmBindings() {
  var bindings = {};
  LLM_PURPOSES.forEach(function(p) {
    var providerId = document.getElementById('bind_provider_' + p).value;
    if (!providerId) return;
    bindings[p] = {
      provider_id: providerId,
      model: document.getElementById('llm_m_model_bind_' + p).value,
      temperature: parseFloat(document.getElementById('bind_temp_' + p).value) || 0,
      input_max_tokens: parseInt(document.getElementById('bind_in_' + p).value, 10) || 0,
      output_max_tokens: parseInt(document.getElementById('bind_out_' + p).value, 10) || 0,
      enable_think: document.getElementById('bind_think_' + p).checked
    };
  });
  try {
    await llmApi('PUT', '/llm/bindings', bindings);
    llmState.bindings = bindings;
    await loadLlmSettings();
    toast('绑定已保存并生效');
  } catch (e) { toast('保存失败: ' + e.message, true); }
}

async function testLlmProvider(id, btn) {
  var label = btn ? btn.textContent : '';
  if (btn) {
    btn.disabled = true;
    btn.textContent = '测试中…';
  }
  try {
    var res = await llmApi('POST', '/llm/providers/' + encodeURIComponent(id) + '/test');
    var n = res && res.model_count != null ? res.model_count : null;
    toast(n != null ? ('连接测试成功，获取到 ' + n + ' 个模型') : '连接测试成功');
  } catch (e) {
    toast('测试失败: ' + e.message, true);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = label || '测试';
    }
  }
}

function studyPagerHtml(page, total, pageSize, goFn) {
  var totalPages = Math.ceil(total / pageSize) || 1;
  if (totalPages <= 1) return '';
  return '<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0 0;font-size:12px">\
    <button class="btn btn-sm"' + (page <= 0 ? ' disabled' : '') + ' onclick="' + goFn + '(' + (page - 1) + ')">上一页</button>\
    <span style="color:var(--text-3)">' + (page + 1) + ' / ' + totalPages + '</span>\
    <button class="btn btn-sm"' + (page >= totalPages - 1 ? ' disabled' : '') + ' onclick="' + goFn + '(' + (page + 1) + ')">下一页</button>\
  </div>';
}

function clampStudyPage(page, total, pageSize) {
  var totalPages = Math.ceil(total / pageSize) || 1;
  if (page < 0) return 0;
  if (page >= totalPages) return totalPages - 1;
  return page;
}

// ═══════════════════════════════════════════════════════
// ACTIVATION LINK MANAGEMENT (docs/impl/v1/page.md 步骤 2)
// 布局对齐「知识领域」：左侧领域 rail → 右侧激活链接卡片 → 详情弹窗确认/驳回。
// ═══════════════════════════════════════════════════════

// 卡片展示用的确认态（用户可见三态），与链接内部 status 机映射：
// candidate→待确认；verified/weakened→已确认；deprecated→已驳回。
function activationConfirmStatus(status) {
  if (status === 'candidate') return 'pending_confirm';
  if (status === 'deprecated') return 'rejected';
  return 'confirmed'; // verified / weakened
}
function activationConfirmStatusLabel(status) {
  return ({ pending_confirm: '待确认', confirmed: '已确认', rejected: '已驳回' })[activationConfirmStatus(status)] || status || '';
}
function activationConfirmStatusSort(status) {
  return ({ pending_confirm: 0, confirmed: 1, rejected: 2 })[activationConfirmStatus(status)] || 9;
}

function openActivationView() {
  document.getElementById('activationDrawer').classList.add('open');
  document.getElementById('activationOverlay').classList.remove('hidden');
  loadActivationDomainRail();
}
function closeActivationView() {
  document.getElementById('activationDrawer').classList.remove('open');
  document.getElementById('activationOverlay').classList.add('hidden');
}

async function loadActivationDomainRail() {
  try {
    var r = await api('GET', '/domains');
    S.activationDomainList = (r.ok && Array.isArray(r.data)) ? r.data : [];
  } catch (e) { S.activationDomainList = []; }
  if (!S.activationDomainSelectedId || !S.activationDomainList.some(function(d) { return d.domain_id === S.activationDomainSelectedId; })) {
    S.activationDomainSelectedId = (S.activationDomainList[0] && S.activationDomainList[0].domain_id) || null;
  }
  renderActivationDomainRail();
  renderActivationDomainPane();
}

function filterActivationDomainRail(v) { S.activationDomainFilter = v; renderActivationDomainRail(); }

function renderActivationDomainRail() {
  var list = document.getElementById('activationDomainRailList');
  if (!list) return;
  var f = (S.activationDomainFilter || '').trim().toLowerCase();
  var items = (S.activationDomainList || []).filter(function(d) { return !f || (d.name || '').toLowerCase().indexOf(f) !== -1; });
  if (!items.length) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:12px">暂无领域</div>';
    return;
  }
  list.innerHTML = items.map(function(d) {
    var stats = (S.activationDomainStats || {})[d.domain_id] || {};
    var count = stats.total != null ? stats.total : '·';
    var pending = stats.pending || 0;
    return '<div class="domain-rail-item' + (d.domain_id === S.activationDomainSelectedId ? ' active' : '') + '" onclick="selectActivationDomainRail(\'' + esc(d.domain_id) + '\')">\
      <span class="domain-rail-name">' + esc(d.name) + '</span>\
      <span class="domain-rail-count">' + count + '</span>\
      ' + (pending > 0 ? '<span class="domain-rail-signal" title="' + pending + ' 条待确认">' + pending + '</span>' : '') + '\
    </div>';
  }).join('');
}

function selectActivationDomainRail(domainId) {
  S.activationDomainSelectedId = domainId;
  renderActivationDomainRail();
  renderActivationDomainPane();
}

// 领域下的激活链接 = 该领域概念挂载的 KP 对应的 activation_links（一对一）。
async function fetchActivationLinksForDomain(domainId) {
  var conceptsR = await api('GET', '/entries?domain_id=' + encodeURIComponent(domainId));
  var entries = (conceptsR.ok && Array.isArray(conceptsR.data)) ? conceptsR.data : [];
  if (!entries.length) return [];
  var detailResults = await Promise.all(entries.map(function(c) {
    return api('GET', '/entries/' + encodeURIComponent(c.entry_id));
  }));
  var pointIds = [];
  var seen = {};
  detailResults.forEach(function(cr) {
    if (!cr.ok || !cr.data) return;
    (cr.data.points || []).forEach(function(pt) {
      if (pt.point_id && !seen[pt.point_id]) { seen[pt.point_id] = true; pointIds.push(pt.point_id); }
    });
  });
  if (!pointIds.length) return [];
  var lr = await api('GET', '/activation-links?point_ids=' + pointIds.map(encodeURIComponent).join(','));
  return (lr.ok && Array.isArray(lr.data)) ? lr.data : [];
}

async function renderActivationDomainPane() {
  var pane = document.getElementById('activationDomainPane');
  if (!pane) return;
  var d = (S.activationDomainList || []).find(function(x) { return x.domain_id === S.activationDomainSelectedId; });
  if (!d) {
    pane.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:12px">请先在「知识领域」中新增领域</div>';
    return;
  }
  var domainId = d.domain_id;
  pane.innerHTML = '\
    <div style="min-width:0">\
      <div style="font-size:16px;font-weight:700">' + esc(d.name) + '</div>\
      <div style="font-size:12.5px;color:var(--text-2);margin-top:4px">' + esc(d.description || '暂无简介') + '</div>\
      <div style="display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--text-3)">\
        <span>激活链接 <b style="color:var(--text)" id="activationDomainLinkCount">…</b></span>\
      </div>\
    </div>\
    <div class="domain-concept-grid" id="activationDomainGrid" style="margin-top:12px"><div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--text-3);font-size:12px">加载中...</div></div>';

  var links = [];
  try { links = await fetchActivationLinksForDomain(domainId); }
  catch (e) { links = []; }
  if (S.activationDomainSelectedId !== domainId) return;

  links.sort(function(a, b) {
    var sa = activationConfirmStatusSort(a.status);
    var sb = activationConfirmStatusSort(b.status);
    if (sa !== sb) return sa - sb;
    return String(b.created_at || '').localeCompare(String(a.created_at || ''));
  });
  S.activationLinksList = links;
  var pending = links.filter(function(l) { return activationConfirmStatus(l.status) === 'pending_confirm'; }).length;
  S.activationDomainStats = S.activationDomainStats || {};
  S.activationDomainStats[domainId] = { total: links.length, pending: pending };
  renderActivationDomainRail();

  var countEl = document.getElementById('activationDomainLinkCount');
  if (countEl) countEl.textContent = String(links.length);

  var grid = document.getElementById('activationDomainGrid');
  if (!grid) return;
  grid.innerHTML = links.length
    ? links.map(renderActivationLinkCardHtml).join('')
    : '<div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--text-3);font-size:12px">该领域下还没有激活链接</div>';
}

function renderActivationLinkCardHtml(l) {
  var confirmStatus = activationConfirmStatus(l.status);
  var label = activationConfirmStatusLabel(l.status);
  var cls = confirmStatus === 'confirmed' ? 'confirmed' : 'candidate status-' + confirmStatus;
  var badgeCls = 'status-' + confirmStatus;
  var desc = l.point_summary || l.unit_center || '';
  return '<div class="domain-concept-card ' + cls + '" onclick="selectActivationLink(\'' + esc(l.link_id) + '\')">\
    <div class="dcc-top"><div class="dcc-name">' + esc(l.question_terms || '(未命名)') + '</div><span class="dcc-status-badge ' + badgeCls + '">' + esc(label) + '</span></div>\
    <div class="dcc-desc">' + esc(desc) + '</div>\
    <div class="dcc-kp">采纳 ' + (l.adopt_count || 0) + ' / 失败 ' + (l.fail_count || 0) + '</div>\
  </div>';
}

async function selectActivationLink(linkId) {
  S.activationSelectedId = linkId;
  var detail = document.getElementById('activationLinkModalContent');
  detail.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-3)">加载中...</div>';
  document.getElementById('activationLinkModal').classList.remove('hidden');
  try {
    var r = await api('GET', '/activation-links/' + linkId);
    if (!r.ok || !r.data) { detail.innerHTML = '<div style="color:var(--red);padding:20px">加载失败</div>'; return; }
    renderActivationLinkDetail(r.data);
  } catch(e) { detail.innerHTML = '<div style="color:var(--red);padding:20px">加载失败</div>'; }
}

function closeActivationLinkModal() {
  document.getElementById('activationLinkModal').classList.add('hidden');
  S.linkDetailCache = null;
}

function linkActionLabel(a) {
  return ({ create_candidate:'创建候选', promote:'晋升', weaken:'降权', reverify:'重新验证', deprecate:'淘汰' })[a] || a || '';
}
function linkStatusLabel(s) {
  return ({ applied:'已应用', pending_confirm:'待确认', rejected:'已驳回', expired:'已过期' })[s] || s || '';
}
function linkReasonLabel(r) {
  if (!r) return '';
  if (r === 'manual_confirm') return '人工确认';
  if (r === 'manual_reject') return '人工驳回';
  return r;
}

function renderActivationLinkDetail(d) {
  var detail = document.getElementById('activationLinkModalContent');
  S.linkDetailCache = { linkId: d.link_id, questions: null, results: null };
  var statusLabel = activationConfirmStatusLabel(d.status);
  var statusBadgeCls = 'status-' + activationConfirmStatus(d.status);
  var actionsHtml = '<div class="modal-actions" style="margin-top:14px;justify-content:flex-start">';
  if (d.status === 'candidate') {
    actionsHtml += '\
      <button class="btn btn-primary btn-sm" onclick="confirmActivationLink(\'' + esc(d.link_id) + '\')">确认</button>\
      <button class="btn btn-sm" style="color:var(--red)" onclick="rejectActivationLink(\'' + esc(d.link_id) + '\')">驳回</button>';
  }
  actionsHtml += '<button class="btn btn-sm" onclick="closeActivationLinkModal()">关闭</button></div>';
  if (d.status === 'candidate' && d.pending_promote_reason) {
    actionsHtml += '<div style="font-size:12px;color:var(--text-3);margin-top:8px">待确认原因：' + esc(d.pending_promote_reason) + '</div>';
  }
  var kpHtml = d.point_summary
    ? '<span class="dv" style="cursor:pointer" title="点击展开所属知识单元内容" onclick="toggleLinkUnitContent(\'' + esc(d.unit_id || '') + '\')">' + esc(d.point_summary) + ' <span style="color:var(--accent);font-size:12px">▾ 展开单元</span></span>'
    : '<span class="dv" style="color:var(--text-3)">' + esc(d.point_id || '') + '（知识点已不存在）</span>';
  detail.innerHTML = '\
    <h2 style="font-size:16px;font-weight:700;margin-bottom:14px">' + esc(d.question_terms || '') + '</h2>\
    <div class="detail-row"><span class="dl">状态</span><span class="dv"><span class="dcc-status-badge ' + statusBadgeCls + '">' + esc(statusLabel) + '</span>' + (d.status === 'weakened' ? ' <span style="color:var(--text-3);font-size:12px">（已弱化）</span>' : '') + '</span></div>\
    <div class="detail-row"><span class="dl">来源文档</span><span class="dv">' + esc(d.source_title || '-') + '</span></div>\
    <div class="detail-row"><span class="dl">知识点</span>' + kpHtml + '</div>\
    <div id="linkUnitContent"></div>\
    <div class="detail-row"><span class="dl">所属单元</span><span class="dv">' + esc(d.unit_center || '') + '</span></div>\
    <div class="detail-row"><span class="dl">观测条件</span><span class="dv">' + formatObservedConditions(d.observed_conditions) + '</span></div>\
    <div class="detail-row"><span class="dl">采纳/失败</span><span class="dv">' + (d.adopt_count||0) + ' / ' + (d.fail_count||0) + '</span></div>\
    ' + actionsHtml + '\
    <div class="lazy-section" id="linkQuestionsSection">\
      <button type="button" class="lazy-section-head" onclick="toggleLinkQuestionsSection(\'' + esc(d.link_id) + '\')">\
        <span>问法列表</span><span class="chev">▾</span>\
      </button>\
      <div class="lazy-section-body" id="linkQuestionsBody"><div style="color:var(--text-3);font-size:12px">点击展开后加载</div></div>\
    </div>\
    <div class="lazy-section" id="linkHistorySection">\
      <button type="button" class="lazy-section-head" onclick="toggleLinkHistorySection(\'' + esc(d.link_id) + '\')">\
        <span>状态迁移史</span><span class="chev">▾</span>\
      </button>\
      <div class="lazy-section-body" id="linkHistoryBody"><div style="color:var(--text-3);font-size:12px">点击展开后加载</div></div>\
    </div>';
}

async function toggleLinkQuestionsSection(linkId) {
  var section = document.getElementById('linkQuestionsSection');
  var body = document.getElementById('linkQuestionsBody');
  if (!section || !body) return;
  if (section.classList.contains('open')) { section.classList.remove('open'); return; }
  section.classList.add('open');
  if (S.linkDetailCache && S.linkDetailCache.linkId === linkId && S.linkDetailCache.questions) {
    body.innerHTML = renderLinkQuestionsHtml(S.linkDetailCache.questions);
    return;
  }
  body.innerHTML = '<div style="color:var(--text-3);font-size:12px">加载中...</div>';
  try {
    var r = await api('GET', '/activation-links/' + linkId + '/questions');
    if (!r.ok || !r.data) { body.innerHTML = '<div style="color:var(--red);font-size:12px">加载失败</div>'; return; }
    if (S.linkDetailCache && S.linkDetailCache.linkId === linkId) S.linkDetailCache.questions = r.data;
    body.innerHTML = renderLinkQuestionsHtml(r.data);
  } catch (e) {
    body.innerHTML = '<div style="color:var(--red);font-size:12px">加载失败：' + esc(e.message) + '</div>';
  }
}

function renderLinkQuestionsHtml(data) {
  function items(list) {
    if (!list || !list.length) return '<div style="font-size:12px;color:var(--text-3)">暂无</div>';
    return list.map(function(q) {
      return '<div class="q-item"><div>' + esc(q.question || '') + '</div>\
        <div class="q-meta">' + dateStr(q.created_at) + (q.path_type ? ' · ' + esc(q.path_type) : '') + (q.retrieval_quality ? ' · ' + esc(q.retrieval_quality) : '') + '</div></div>';
    }).join('');
  }
  return '<div class="lazy-subhead">匹配命中</div>' + items(data.matched)
    + '<div class="lazy-subhead">创建依据</div>' + items(data.created_from);
}

async function toggleLinkHistorySection(linkId) {
  var section = document.getElementById('linkHistorySection');
  var body = document.getElementById('linkHistoryBody');
  if (!section || !body) return;
  if (section.classList.contains('open')) { section.classList.remove('open'); return; }
  section.classList.add('open');
  if (S.linkDetailCache && S.linkDetailCache.linkId === linkId && S.linkDetailCache.results) {
    body.innerHTML = renderLinkHistoryHtml(S.linkDetailCache.results);
    return;
  }
  body.innerHTML = '<div style="color:var(--text-3);font-size:12px">加载中...</div>';
  try {
    var r = await api('GET', '/activation-links/' + linkId + '/learning-results');
    if (!r.ok || !r.data) { body.innerHTML = '<div style="color:var(--red);font-size:12px">加载失败</div>'; return; }
    var results = Array.isArray(r.data) ? r.data : [];
    if (S.linkDetailCache && S.linkDetailCache.linkId === linkId) S.linkDetailCache.results = results;
    body.innerHTML = renderLinkHistoryHtml(results);
  } catch (e) {
    body.innerHTML = '<div style="color:var(--red);font-size:12px">加载失败：' + esc(e.message) + '</div>';
  }
}

function renderLinkHistoryHtml(results) {
  if (!results.length) return '<div style="font-size:12px;color:var(--text-3)">暂无状态迁移记录</div>';
  return results.map(function(r) {
    var action = r.action || r.Action || '';
    var status = r.status || r.Status || '';
    var reason = r.reason || r.Reason || '';
    var created = r.created_at || r.CreatedAt || '';
    return '<div class="timeline-event"><b>' + esc(linkActionLabel(action)) + '</b> · <span class="badge">' + esc(linkStatusLabel(status)) + '</span> · ' + dateStr(created)
      + '<div style="color:var(--text-2);margin-top:2px">' + esc(linkReasonLabel(reason)) + '</div></div>';
  }).join('');
}

// toggleLinkUnitContent expands the link dialog's KP row into its owning KU's
// original text: unit meta from GET /units/:id, body sliced from the source
// markdown by line_start/line_end (1-based inclusive — the repo-wide位置约定).
async function toggleLinkUnitContent(unitId) {
  var el = document.getElementById('linkUnitContent');
  if (!el) return;
  if (el.innerHTML) { el.innerHTML = ''; return; } // toggle closed
  if (!unitId) { el.innerHTML = '<div class="ku-context">该链接未关联知识单元</div>'; return; }
  el.innerHTML = '<div class="ku-context">加载中...</div>';
  try {
    var r = await api('GET', '/units/' + unitId);
    if (!r.ok || !r.data) { el.innerHTML = '<div class="ku-context">单元加载失败</div>'; return; }
    var u = r.data;
    var body = u.content
      ? '<pre style="white-space:pre-wrap;margin-top:6px;font-size:12px;max-height:240px;overflow-y:auto;background:var(--bg-2);padding:8px;border-radius:6px">' + esc(u.content) + '</pre>'
      : '';
    var pts = (u.points || []).map(function(p) { return '<div style="margin-top:4px;font-size:12px;color:var(--text-2)">· ' + esc(p.content) + '</div>'; }).join('');
    el.innerHTML = '<div class="ku-context"><b>' + esc(u.center || '') + '</b> (L' + u.line_start + '-L' + u.line_end + ')'
      + (u.lifecycle && u.lifecycle !== 'current' ? ' ' + lifecycleBadgeHtml(u.lifecycle) : '')
      + body
      + (pts ? '<div style="margin-top:6px;font-size:11px;color:var(--text-3)">单元内知识点：</div>' + pts : '')
      + '</div>';
  } catch(ex) { el.innerHTML = '<div class="ku-context">加载失败：' + esc(ex.message) + '</div>'; }
}

function refreshActivationViewIfOpen() {
  if (document.getElementById('activationDrawer').classList.contains('open')) {
    renderActivationDomainPane();
  }
}

async function confirmActivationLink(linkId) {
  if (!(await showConfirm('确认将该激活链接标记为已确认？'))) return;
  try {
    var r = await api('POST', '/activation-links/' + linkId + '/confirm');
    if (r.ok) {
      selectActivationLink(linkId);
      refreshActivationViewIfOpen();
      if (S.wikiConceptId) loadConceptKPLinksSection(S.wikiConceptId);
      pollActivationPendingCount();
      if (document.getElementById('studyDrawer').classList.contains('open') && S.studyTab === 'overview') loadStudyReport();
    }
    else alert('操作失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('操作出错：' + e.message); }
}

async function rejectActivationLink(linkId) {
  if (!(await showConfirm('确认驳回该激活链接？'))) return;
  try {
    var r = await api('POST', '/activation-links/' + linkId + '/reject');
    if (r.ok) {
      selectActivationLink(linkId);
      refreshActivationViewIfOpen();
      if (S.wikiConceptId) loadConceptKPLinksSection(S.wikiConceptId);
      pollActivationPendingCount();
      if (document.getElementById('studyDrawer').classList.contains('open') && S.studyTab === 'overview') loadStudyReport();
    }
    else alert('操作失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('操作出错：' + e.message); }
}

// 待确认徽标：激活链接入口只计 promote pending_confirm；Wiki 入口计
// wiki_candidate / topic_page_candidate（docs/impl/v1/page.md 步骤 2/3）。
async function pollActivationPendingCount() {
  var total = 0;
  try {
    var r = await api('GET', '/study/results?action=promote&status=pending_confirm&limit=200');
    total = Array.isArray(r.data) ? r.data.length : 0;
  } catch(e) { /* ignore */ }
  var badge = document.getElementById('activationPendingBadge');
  if (badge) { badge.textContent = total; badge.classList.toggle('hidden', total === 0); }
}

async function pollWikiPendingCount() {
  var total = 0;
  try {
    var r2 = await api('GET', '/study/results?action=wiki_candidate&status=pending_confirm&limit=200');
    total += Array.isArray(r2.data) ? r2.data.length : 0;
  } catch(e) { /* ignore */ }
  try {
    var r3 = await api('GET', '/study/results?action=topic_page_candidate&status=pending_confirm&limit=200');
    total += Array.isArray(r3.data) ? r3.data.length : 0;
  } catch(e) { /* ignore */ }
  var badge = document.getElementById('wikiPendingBadge');
  if (badge) { badge.textContent = total; badge.classList.toggle('hidden', total === 0); }
}

// WIKI VIEW（docs/impl/v1/page.md 步骤 3）
// 左侧知识领域 rail → 右侧该领域下全部 Wiki 卡片（主题/说明/状态）→
// 点击卡片打开详情弹窗（发布/重编译/归档/派生草稿；待编译走 analyze→compile）。
// UI 复用「知识领域」页面的 .domain-rail / .domain-concept-* 结构。
// ═══════════════════════════════════════════════════════
var WIKI_STATUS_LABELS = {
  pending_compile: '待编译',
  draft: '草稿',
  needs_recompile: '待重编译',
  published: '已发布',
  archived: '已删除'
};

function openWikiView() {
  document.getElementById('wikiDrawer').classList.add('open');
  document.getElementById('wikiOverlay').classList.remove('hidden');
  loadWikiCatalog();
}
function closeWikiView() {
  document.getElementById('wikiDrawer').classList.remove('open');
  document.getElementById('wikiOverlay').classList.add('hidden');
}

// 从 Answer 引用徽标跳转到某个已发布 Wiki 页面：选中其所属知识领域后打开详情。
async function openWikiPageFromBadge(pageId) {
  if (!pageId) return;
  openWikiView();
  await loadWikiCatalog();
  var domainId = null;
  (S.wikiCatalog || []).some(function(d) {
    return (d.pages || []).some(function(p) {
      if (p.page_id === pageId) { domainId = d.domain_id; return true; }
      return false;
    });
  });
  if (domainId) {
    S.wikiDomainSelectedId = domainId;
    renderWikiDomainRail();
    renderWikiDomainPane();
  }
  openWikiEntryDetail(pageId);
}

async function loadWikiCatalog() {
  try {
    var r = await api('GET', '/wiki/catalog');
    S.wikiCatalog = (r.ok && Array.isArray(r.data)) ? r.data : [];
  } catch(e) { S.wikiCatalog = []; }
  if (!S.wikiDomainSelectedId || !(S.wikiCatalog || []).some(function(d) { return d.domain_id === S.wikiDomainSelectedId; })) {
    S.wikiDomainSelectedId = (S.wikiCatalog[0] && S.wikiCatalog[0].domain_id) || null;
  }
  // 候选列表缓存，供 openWikiCompileCandidate 按 result_id 查找。
  S.wikiCandidateList = [];
  (S.wikiCatalog || []).forEach(function(d) {
    (d.pages || []).forEach(function(p) {
      if (p.kind === 'candidate') {
        S.wikiCandidateList.push({
          resultId: p.result_id,
          conceptId: p.entry_id,
          conceptName: p.title,
          reason: p.description || '',
          qualifyingKpCount: null
        });
      }
    });
  });
  renderWikiDomainRail();
  renderWikiDomainPane();
}

function filterWikiDomainRail(v) { S.wikiDomainFilter = v; renderWikiDomainRail(); }

function renderWikiDomainRail() {
  var list = document.getElementById('wikiDomainRailList');
  var f = (S.wikiDomainFilter || '').trim().toLowerCase();
  var items = (S.wikiCatalog || []).filter(function(d) { return !f || (d.name || '').toLowerCase().indexOf(f) !== -1; });
  if (!items.length) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:12px">暂无领域</div>';
    return;
  }
  list.innerHTML = items.map(function(d) {
    var pending = (d.pages || []).filter(function(p) {
      return p.status === 'pending_compile' || p.status === 'draft' || p.status === 'needs_recompile';
    }).length;
    return '<div class="domain-rail-item' + (d.domain_id === S.wikiDomainSelectedId ? ' active' : '') + '" onclick="selectWikiDomainRail(\'' + esc(d.domain_id) + '\')">\
      <span class="domain-rail-name">' + esc(d.name) + '</span>\
      <span class="domain-rail-count">' + (d.wiki_count || 0) + '</span>\
      ' + (pending > 0 ? '<span class="domain-rail-signal" title="' + pending + ' 条待处理">' + pending + '</span>' : '') + '\
    </div>';
  }).join('');
}

function selectWikiDomainRail(domainId) {
  S.wikiDomainSelectedId = domainId;
  renderWikiDomainRail();
  renderWikiDomainPane();
}

function renderWikiDomainPane() {
  var pane = document.getElementById('wikiDomainPane');
  var d = (S.wikiCatalog || []).find(function(x) { return x.domain_id === S.wikiDomainSelectedId; });
  if (!d) {
    pane.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:12px">请先在「知识领域」中新增领域</div>';
    return;
  }
  var pages = d.pages || [];
  var cardsHtml = pages.map(renderWikiCatalogCardHtml).join('');
  if (!cardsHtml) {
    cardsHtml = '<div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--text-3);font-size:12px">该领域下还没有 Wiki</div>';
  }
  pane.innerHTML = '\
    <div style="min-width:0">\
      <div style="font-size:16px;font-weight:700">' + esc(d.name) + '</div>\
      <div style="font-size:12.5px;color:var(--text-2);margin-top:4px">' + esc(d.description || '暂无简介') + '</div>\
      <div style="display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--text-3)">\
        <span>Wiki <b style="color:var(--text)">' + (d.wiki_count || 0) + '</b></span>\
      </div>\
    </div>\
    <div class="domain-concept-grid" id="wikiDomainGrid" style="margin-top:12px">' + cardsHtml + '</div>';
}

function wikiStatusLabel(status) {
  return WIKI_STATUS_LABELS[status] || status || '';
}

function renderWikiCatalogCardHtml(p) {
  var status = p.status || '';
  var label = wikiStatusLabel(status);
  var isOfficial = status === 'published';
  var cls = isOfficial ? 'confirmed' : 'candidate';
  if (status === 'archived') cls += ' status-archived';
  else if (status === 'pending_compile') cls += ' status-pending_confirm';
  var badgeCls = 'status-' + status;
  var onclick = p.kind === 'candidate'
    ? 'openWikiCompileCandidate(\'' + esc(p.result_id) + '\')'
    : 'openWikiEntryDetail(\'' + esc(p.page_id) + '\')';
  return '<div class="domain-concept-card ' + cls + '" onclick="' + onclick + '">\
    <div class="dcc-top"><div class="dcc-name">' + esc(p.title || '(未命名)') + '</div><span class="dcc-status-badge ' + badgeCls + '">' + esc(label) + '</span></div>\
    <div class="dcc-desc">' + esc(p.description || '') + '</div>\
  </div>';
}

function openWikiCompileCandidate(resultId) {
  var c = (S.wikiCandidateList || []).find(function(x) { return x.resultId === resultId; });
  var detail = document.getElementById('wikiDetailModalContent');
  document.getElementById('wikiDetailModal').classList.remove('hidden');
  S.wikiConceptId = null;
  if (!c) { detail.innerHTML = '<div style="color:var(--red);padding:20px">未找到候选</div>'; return; }
  detail.innerHTML = '\
    <h2 style="font-size:16px;font-weight:700;margin-bottom:14px">' + esc(c.conceptName) + '</h2>\
    <div class="detail-row"><span class="dl">合格 KP</span><span class="dv">' + (c.qualifyingKpCount != null ? c.qualifyingKpCount : '-') + ' 个</span></div>\
    <div class="detail-row"><span class="dl">Learning Reason</span><span class="dv">' + esc(c.reason || '') + '</span></div>\
    <div style="margin-top:16px;display:flex;gap:8px;align-items:center">\
      <button class="btn btn-primary btn-sm" onclick="analyzeWikiCandidate(\'' + esc(c.conceptId) + '\',\'' + esc(c.resultId) + '\')">分析（生成结论）</button>\
    </div>\
    <div id="wikiAnalyzeResult" style="margin-top:10px"></div>\
    <div id="wikiCompileStatus" style="margin-top:10px;font-size:12px;color:var(--text-3)"></div>\
    <div class="modal-actions"><button class="btn btn-sm" onclick="closeWikiDetailModal()">关闭</button></div>';
}

function closeWikiDetailModal() {
  document.getElementById('wikiDetailModal').classList.add('hidden');
  S.wikiConceptId = null;
}

// 人工手动指定主题（docs/design/wiki.md「主题：从真实使用中识别」一节 +
// docs/impl/v1/wiki.md 步骤 8「人工手动指定主题」，2026-08-03 修订）：
// 只有一个输入口径——给主题名称/范围描述（不选 concept），系统据此检索
// qualifying KP、按概念归属分组；落在几个概念名下决定编译停在一阶还是
// 走完二阶（docs/design/wiki.md:84），不是两条并行的生成逻辑。

function openManualWikiCompilePicker() {
  var detail = document.getElementById('wikiDetailModalContent');
  document.getElementById('wikiDetailModal').classList.remove('hidden');
  S.wikiConceptId = null;

    return { domain_id: d.domain_id, name: d.name };
  });
  if (!domains.length) {
    detail.innerHTML = '\
      <h2 style="font-size:16px;font-weight:700;margin-bottom:14px">生成 Wiki</h2>\
      <div style="font-size:12px;color:var(--text-3)">请先在「知识领域」中新增领域并确认概念。</div>\
      <div class="modal-actions"><button class="btn btn-sm" onclick="closeWikiDetailModal()">关闭</button></div>';
    return;
  }
  detail.innerHTML = '\
    <h2 style="font-size:16px;font-weight:700;margin-bottom:8px">生成 Wiki</h2>\
