    <div style="display:flex;flex-direction:column;gap:8px">\
      <label style="font-size:12px;color:var(--text-3)">主题名称\
        <input id="wikiManualTopicName" style="width:100%;box-sizing:border-box;margin-top:4px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px;background:var(--bg);color:var(--text)" placeholder="例如：合同违约责任认定" />\
      </label>\
      <label style="font-size:12px;color:var(--text-3)">范围描述（可选）\
        <textarea id="wikiManualTopicDescription" rows="3" style="width:100%;box-sizing:border-box;margin-top:4px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px;background:var(--bg);color:var(--text);resize:vertical" placeholder="补充说明这个主题的范围，帮助检索更准确"></textarea>\
      </label>\
      <label style="font-size:12px;color:var(--text-3)">限定知识领域（可选）\
        <select id="wikiManualPickerDomain" style="width:100%;margin-top:4px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px;background:var(--bg);color:var(--text)">\
          <option value="">全部领域</option>\
          ' + domains.map(function(d) {
            return '<option value="' + esc(d.domain_id) + '">' + esc(d.name) + '</option>';
          }).join('') + '\
        </select>\
      </label>\
    </div>\
    <div style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="submitWikiTopicResolve()">检索并生成</button></div>\
    <div id="wikiManualTopicCreateStatus" style="margin-top:8px;font-size:12px;color:var(--text-3)"></div>\
    <div class="modal-actions"><button class="btn btn-sm" onclick="closeWikiDetailModal()">关闭</button></div>';
}

async function submitWikiTopicResolve() {
  var statusEl = document.getElementById('wikiManualTopicCreateStatus');
  var nameEl = document.getElementById('wikiManualTopicName');
  var descEl = document.getElementById('wikiManualTopicDescription');
  var topicName = nameEl ? nameEl.value.trim() : '';
  if (!topicName) {
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">请填写主题名称</span>';
    return;
  }
  if (statusEl) statusEl.textContent = '检索中...';
  var domainSel = document.getElementById('wikiManualPickerDomain');
  try {
    var r = await api('POST', '/wiki/topics', {
      topic_name: topicName,
      topic_description: descEl ? descEl.value.trim() : '',
      domain_id: domainSel ? domainSel.value : ''
    });
    if (!r.ok) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">检索失败：' + esc(r.data && (r.data.message || r.data.error) ? (r.data.message || r.data.error) : JSON.stringify(r.data)) + '</span>';
      return;
    }
    var d = r.data || {};
    var memberIds = d.member_page_ids || [];
    var pendingEntries = d.pending_concepts || [];
    var uncoveredConcepts = d.uncovered_entries || [];
    // docs/design/wiki.md:84——检索结果只落在一个概念下时，不需要主题页
    // 这一层，直接把候选建的壳页归档，改为打开这个概念页本身。
    var singleConcept = memberIds.length === 1 && !pendingEntries.length && !uncoveredConcepts.length;
    if (singleConcept) {
      if (statusEl) statusEl.textContent = '结果只落在一个词条下，直接打开该词条页...';
      try { await api('POST', '/wiki/pages/' + d.page_id + '/archive'); } catch (e) { /* best-effort cleanup */ }
      await loadWikiCatalog();
      closeWikiDetailModal();
      openWikiEntryDetail(memberIds[0]);
      return;
    }
    var readiness = d.readiness || {};
    if (statusEl) {
      statusEl.innerHTML = '\
        <div style="color:var(--green)">已创建主题页壳「' + esc(d.title || '') + '」</div>\
        <div style="margin-top:4px">已发布成员 ' + (readiness.member_count || 0) + ' 个 · related ' + (readiness.related_connection_count || 0) + ' 条 · contradicts ' + (readiness.contradicts_connection_count || 0) + ' 条 · 可靠度 ' + ((readiness.reliability_ratio || 0).toFixed ? readiness.reliability_ratio.toFixed(2) : readiness.reliability_ratio) + '（参考阈值 ' + readiness.reliability_min + '）</div>' +
        (pendingEntries.length ? '<div style="margin-top:4px">待发布概念 ' + pendingEntries.length + ' 个（已推进候选，发布后自动补入）</div>' : '') +
        (uncoveredConcepts.length ? '<div style="margin-top:4px">未覆盖概念 ' + uncoveredConcepts.length + ' 个</div>' : '');
    }
    await loadWikiCatalog();
    if (d.page_id) {
      closeWikiDetailModal();
      openWikiEntryDetail(d.page_id);
    }
  } catch (e) {
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">检索出错：' + esc(e.message) + '</span>';
  }
}

// readinessHtml 渲染 Analyze 响应里可选的 readiness 快照（docs/impl/v1/wiki.md
// 步骤 2）——qualifying_kp_count/related/contradicts/days_active/cohesion，
// 跟 Study 判定 wiki_candidate ready 用的是同一组信号，仅供人工参考，不是
// 通过/失败的判定结果（没有 recommendation 字段，人工自己看数字判断）。
// Study 推荐路径下这个字段同样会返回，两条口径共用同一份展示逻辑。
function readinessHtml(r) {
  if (!r) return '';
  var daysOk = r.days_active >= r.days_active_min;
  var cohesionOk = r.cohesion_min <= 0 || r.cohesion >= r.cohesion_min;
  return '\
    <h3 style="margin-top:10px;font-size:13px;color:var(--text-3);text-transform:uppercase">参考信号（仅供参考，不阻断）</h3>\
    <div style="margin-top:6px;font-size:12px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:10px">\
      <span>合格 KP：' + r.qualifying_kp_count + ' 个</span>\
      <span>KPN 连接：related ' + r.related_connection_count + ' / contradicts ' + r.contradicts_connection_count + '</span>\
      <span style="color:' + (daysOk ? 'var(--text-2)' : 'var(--orange, #b8860b)') + '">活跃天数：' + r.days_active + '（门槛 ' + r.days_active_min + '）</span>\
      <span style="color:' + (cohesionOk ? 'var(--text-2)' : 'var(--orange, #b8860b)') + '">内聚度：' + r.cohesion.toFixed(2) + (r.cohesion_min > 0 ? '（门槛 ' + r.cohesion_min.toFixed(2) + '）' : '（门槛未开启）') + '</span>\
    </div>';
}

// 概念页编译的分析→确认两步（docs/design/wiki-compilation.md "编译内部分两
// 步"）：先出扁平的结论/张力列表（claims 可能带 aspect_id，仅供参考展示），
// 人工确认后原样带回 /wiki/compile，服务端就不再重新跑一次分析阶段。
async function analyzeWikiCandidate(conceptId, resultId) {
  var host = document.getElementById('wikiAnalyzeResult');
  host.innerHTML = '<div style="color:var(--text-3);font-size:12px">分析中...</div>';
  try {
    var r = await api('POST', '/wiki/compile/analyze', { entry_id: conceptId, result_id: resultId });
    if (!r.ok || !r.data) { host.innerHTML = '<div style="color:var(--red);font-size:12px">分析失败：' + esc(r.data && r.data.error ? r.data.error : JSON.stringify(r.data)) + '</div>'; return; }
    var o = r.data;
    var claims = o.claims || [];
    var tensions = o.tensions || [];
    host.innerHTML = '\
      ' + readinessHtml(o.readiness) + '\
      <h3 style="margin-top:10px;font-size:13px;color:var(--text-3);text-transform:uppercase">拟采用的论断结构（' + claims.length + ' 条）</h3>\
      <div style="margin-top:6px">' + claims.map(function(cl) { return '<div class="detail-row"><span class="dv">' + esc(cl.summary) + (cl.aspect_id ? ' <span class="badge">' + esc(cl.aspect_id) + '</span>' : '') + ' <span style="color:var(--text-3)">[' + (cl.cited_point_ids||[]).join(', ') + ']</span></span></div>'; }).join('') + '</div>\
      ' + (tensions.length ? '<h3 style="margin-top:10px;font-size:13px;color:var(--text-3);text-transform:uppercase">张力/待验证点</h3><div style="margin-top:6px">' + tensions.map(function(t) { return '<div class="detail-row"><span class="dv">' + esc(t.description) + '</span></div>'; }).join('') + '</div>' : '') + '\
      <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="compileWikiCandidate(\'' + esc(conceptId) + '\',\'' + esc(resultId) + '\')">确认并编译</button>';
    S.wikiAnalyzeCache = S.wikiAnalyzeCache || {};
    S.wikiAnalyzeCache[conceptId] = { claims: claims, tensions: tensions };
  } catch(e) { host.innerHTML = '<div style="color:var(--red);font-size:12px">分析出错：' + esc(e.message) + '</div>'; }
}

async function compileWikiCandidate(conceptId, resultId) {
  var statusEl = document.getElementById('wikiCompileStatus');
  statusEl.textContent = '编译中，可能需要一些时间...';
  var cached = (S.wikiAnalyzeCache && S.wikiAnalyzeCache[conceptId]) || {};
  try {
    var r = await api('POST', '/wiki/compile', { entry_id: conceptId, result_id: resultId, claims: cached.claims || [], tensions: cached.tensions || [] });
    if (r.ok) {
      statusEl.innerHTML = '<span style="color:var(--green)">编译成功，已生成草稿</span>';
      pollWikiPendingCount();
      loadWikiCatalog();
      if (r.data && r.data.page_id) {
        closeWikiDetailModal();
        openWikiEntryDetail(r.data.page_id);
      }
    } else {
      statusEl.innerHTML = '<span style="color:var(--red)">编译失败：' + esc(r.data && r.data.message ? r.data.message : JSON.stringify(r.data)) + '</span>';
    }
  } catch(e) { statusEl.innerHTML = '<span style="color:var(--red)">编译出错：' + esc(e.message) + '</span>'; }
}

    renderWikiPageDetail(r.data);

// [point_id] 标注渲染为可点击引用（docs/impl/v1/page.md 步骤 3），点击跳到
// 引用的知识点原文；同时按 claim_checks（阶段 E 支持度核验结果，docs/impl/v1/
// wiki-generation.md）给引用本身上色——不通过核验（unsupported/partial）的
// 结论所引用的 [point_id] 标红/标黄，一眼就能看出哪些内容存疑，不用另外看
// 一张指标表。"稳定结论"/"展开说明"两节里完全没有 [point_id] 标注的段落
// （uncited_sentence_rate 的口径）额外标黄，因为这两节的每句话本该有引用。
// hostId 让同一段渲染逻辑既能用在概念页详情弹窗，也能用在主题页头部面板——
// 两处的引用展开面板是两个不同的 DOM 节点，不能共用固定 id（两者可能同时
// 挂载在 DOM 里：主题页面板常驻在抽屉里，弹窗盖在上面）。
var WIKI_POINT_TAG_RE = /\[([a-zA-Z0-9_-]+)\]/g;
var WIKI_UNCITED_SECTIONS = { '稳定结论': true, '展开说明': true };

// buildPointVerdictMap 把 claim_checks 列表按 cited_point_ids 展开成
// point_id -> 该 point 参与过的最差 verdict（unsupported 优先于 partial
// 优先于 supported），供 renderWikiContent 给引用上色、showPointRefInWiki
// 展示核验理由。
function buildPointVerdictMap(claimChecks) {
  var rank = { unsupported: 3, partial: 2, supported: 1 };
  var map = {};
  (claimChecks || []).forEach(function(c) {
    (c.cited_point_ids || []).forEach(function(pid) {
      var cur = map[pid];
      if (!cur || (rank[c.verdict] || 0) > (rank[cur.verdict] || 0)) {
        map[pid] = { verdict: c.verdict, reason: c.reason, claimText: c.claim_text };
      }
    });
  });
  return map;
}

// splitWikiMarkdownSections 按二级标题（"## "，不含三级 "### "）切分 Markdown
// 正文，供按节分别渲染 + 只在"稳定结论"/"展开说明"节标注未引用段落——摘要/
// 待验证点/依赖来源本来就不要求每句带 [point_id]，不能一并标黄。
function splitWikiMarkdownSections(md) {
  var lines = (md || '').split('\n');
  var sections = [];
  var cur = { heading: '', body: [] };
  lines.forEach(function(line) {
    var m = /^##\s+(.+?)\s*$/.exec(line);
    if (m) {
      sections.push(cur);
      cur = { heading: m[1].trim(), body: [] };
    } else {
      cur.body.push(line);
    }
  });
  sections.push(cur);
  return sections.map(function(s) { return { heading: s.heading, body: s.body.join('\n') }; });
}

function renderWikiContent(content, hostId, claimChecks) {
  var verdictOf = buildPointVerdictMap(claimChecks);
  S.wikiVerdictMap = verdictOf; // showPointRefInWiki 读这份缓存展示核验理由

  var withLinks = (content || '').replace(WIKI_POINT_TAG_RE, function(m, pid) {
    return '[[' + pid + ']](point:' + pid + ')';
  });

  var html = splitWikiMarkdownSections(withLinks).map(function(sec) {
    var bodyHtml = renderMarkdown(sec.body);
    if (WIKI_UNCITED_SECTIONS[sec.heading]) {
      bodyHtml = bodyHtml.replace(/<(p|li)>([\s\S]*?)<\/\1>/g, function(m, tag, inner) {
        if (/href="point:/.test(inner) || !/\S/.test(inner)) return m;
        return '<' + tag + ' class="uncited-para" title="这段没有 [point_id] 标注，未经引用核验，建议人工确认">' + inner + '</' + tag + '>';
      });
    }
    var headingHtml = sec.heading ? '<h2>' + esc(sec.heading) + '</h2>' : '';
    return headingHtml + bodyHtml;
  }).join('');

  html = html.replace(/<a href="point:([^"]+)">/g, function(m, pid) {
    var v = verdictOf[pid];
    var cls = !v ? 'cite-ok' : (v.verdict === 'unsupported' ? 'cite-bad' : v.verdict === 'partial' ? 'cite-warn' : 'cite-ok');
    var title = v && v.reason ? ' title="' + esc(v.reason) + '"' : '';
    return '<a href="point:' + pid + '" class="' + cls + '"' + title + '>';
  });
  return html.replace(/href="point:([^"]+)"/g, 'href="point:$1" onclick="event.preventDefault();showPointRefInWiki(\'$1\',\'' + hostId + '\')"');
}

// wikiCiteLegendHtml 是引用颜色的图例——放在正文顶部说明"蓝=已核验/黄=部分
// 支持/红=未通过核验"，避免用户看到彩色标注却不知道含义。只在存在任何
// claim_checks 数据时才显示（阶段 E 关闭时 claim_checks 恒为空，不展示图例
// 是正确行为，不是遗漏）。
function wikiCiteLegendHtml(claimChecks) {
  if (!claimChecks || !claimChecks.length) return '';
  return '<div class="wiki-cite-legend">\
    <span><i style="background:var(--accent,#4a72d9)"></i>已通过支持度核验</span>\
    <span><i style="background:#9a6a00"></i>部分支持，建议核实</span>\
    <span><i style="background:var(--red)"></i>未通过核验，可能不成立</span>\
    <span><i style="background:var(--yellow-lt,#fdf6e3);border:1px solid #9a6a00"></i>缺少引用标注的段落</span>\
  </div>';
}

async function showPointRefInWiki(pointId, hostId) {
  var host = document.getElementById(hostId);
  if (!host) return;
  host.innerHTML = '<div class="ku-context">加载中...</div>';
  try {
    var r = await api('GET', '/points/' + pointId);
    if (!r.ok || !r.data) { host.innerHTML = '<div class="ku-context">未找到该知识点</div>'; return; }
    var p = r.data;
    var uHtml = '';
    if (p.unit_id) {
      var ur = await api('GET', '/units/' + p.unit_id);
      if (ur.ok && ur.data) uHtml = '<div style="margin-top:6px"><b>所属单元：</b>' + esc(ur.data.center||'') + ' (L' + ur.data.line_start + '-L' + ur.data.line_end + ')</div>';
    }
    var v = (S.wikiVerdictMap || {})[pointId];
    var verdictHtml = '';
    if (v) {
      var labels = { unsupported: ['未通过支持度核验', 'var(--red)'], partial: ['部分支持', '#9a6a00'], supported: ['已通过支持度核验', 'var(--accent,#4a72d9)'] };
      var lbl = labels[v.verdict] || [v.verdict, 'var(--text-2)'];
      verdictHtml = '<div style="margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--bg-2,rgba(127,127,127,.08))">\
        <span style="color:' + lbl[1] + ';font-weight:600">' + esc(lbl[0]) + '</span>\
        ' + (v.reason ? '<div style="margin-top:2px;font-size:12px;color:var(--text-2)">' + esc(v.reason) + '</div>' : '') + '\
        ' + (v.claimText ? '<div style="margin-top:2px;font-size:12px;color:var(--text-3)">所属结论：' + esc(v.claimText) + '</div>' : '') + '\
      </div>';
    }
    host.innerHTML = '<div class="ku-context"><b>' + esc(pointId) + '</b><div style="margin-top:4px">' + esc(p.content||'') + '</div>' + uHtml + verdictHtml + '</div>';
  } catch(e) { host.innerHTML = '<div class="ku-context">加载失败</div>'; }
}

// pageBodyHtml 是概念页详情弹窗和主题页头部面板共用的正文区块（内容 + 成员
// 分工 + 未覆盖知识点 + 关系/草稿/修订三个占位区），按 ids 参数指向各自的
// 容器 id，避免两处同时挂载时 id 冲突。
function pageBodyHtml(p, ids) {
  var revisions = p.revisions || [];
  var uncovered = p.uncovered_points || [];
  var memberRoles = p.member_roles || [];
  var aspects = p.aspects || [];
  return '\
    ' + (p.summary ? '\
    <div style="padding:10px 12px;border-radius:8px;background:var(--bg-2,rgba(127,127,127,.08));font-size:13px;line-height:1.6;color:var(--text-2)">' + esc(p.summary) + '</div>' : '') + '\
    ' + (aspects.length ? '\
    <h3 style="margin-top:14px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">切面结构（' + aspects.length + '）</h3>\
    <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">' + aspects.map(function(a) {
      var qt = (a.question_types || []).slice(0, 3).join('、');
      var title = a.heading + '（' + (a.point_ids||[]).length + ' 个知识点）' + (qt ? ' | 常见问法：' + qt : '');
      return '<span class="badge" title="' + esc(title) + '" style="cursor:default">' + esc(a.heading || a.aspect_id) + ' · ' + (a.point_ids||[]).length + '</span>';
    }).join('') + '</div>' : '') + '\
    ' + wikiCiteLegendHtml(p.claim_checks) + '\
    <div class="wiki-page-content ans-body" style="margin-top:6px">' + renderWikiContent(p.content, ids.pointRef, p.claim_checks) + '</div>\
    <div id="' + ids.pointRef + '"></div>\
    ' + (memberRoles.length ? '\
    <h3 style="margin-top:18px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">成员分工（member_roles）</h3>\
    <div style="margin-top:8px">' + memberRoles.map(function(m) { return '<div class="detail-row"><span class="dl">' + esc(m.member_page_id) + '</span><span class="dv">' + esc(m.aspect || '') + (m.question_types && m.question_types.length ? '（' + m.question_types.map(esc).join('、') + '）' : '') + '</span></div>'; }).join('') + '</div>' : '') + '\
    ' + (uncovered.length ? '\
    <details style="margin-top:18px">\
      <summary style="font-size:13px;color:var(--text-3);cursor:pointer">本主题尚无可用材料的知识点（' + uncovered.length + '）</summary>\
      <div style="margin-top:8px;font-size:12px;color:var(--text-3)">这些 KP 还没有 verified 激活链接，不进稳定结论、不可引用——这几块还写不了。</div>\
      <div style="margin-top:6px">' + uncovered.map(function(u) { return '<div class="detail-row"><span class="dl">' + esc(u.point_id) + '</span><span class="dv">' + esc(u.summary || '') + '</span></div>'; }).join('') + '</div>\
    </details>' : '') + '\
    <h3 style="margin-top:18px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">关系</h3>\
    <div id="' + ids.relations + '" style="margin-top:8px;font-size:12px;color:var(--text-3)">加载中...</div>\
    <h3 style="margin-top:18px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">写作草稿</h3>\
    <div id="' + ids.drafts + '" style="margin-top:8px;font-size:12px;color:var(--text-3)">加载中...</div>\
    <h3 style="margin-top:18px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">修订记录 (' + revisions.length + ')</h3>\
    <div style="margin-top:8px">' + (revisions.length
      ? revisions.map(function(rv) { return '<div class="timeline-event" style="cursor:pointer" onclick="viewWikiRevision(\'' + esc(p.page_id) + '\',\'' + esc(rv.revision_id) + '\',\'' + ids.revision + '\')"><b>' + esc(rv.reason || '') + '</b> · ' + dateStr(rv.created_at) + '</div>'; }).join('')
      : '<div style="font-size:12px;color:var(--text-3)">暂无历史修订</div>') + '</div>\
    <div id="' + ids.revision + '"></div>';
}

// 概念页/主题页详情弹窗：按状态提供发布/重编译/归档/派生草稿；主题页壳
// （content 为空）走分析→编译/驳回，与原主题页头部面板行为一致。
function renderWikiPageDetail(p) {
  var detail = document.getElementById('wikiDetailModalContent');
  var isTopicShell = p.page_type === 'topic' && (!p.content || p.content === '');
  var actionsHtml = '';
  if (isTopicShell) {
    actionsHtml = '<button class="btn btn-sm" onclick="analyzeTopicShell(\'' + esc(p.page_id) + '\')">分析</button>\
      <button class="btn btn-sm" style="color:var(--red)" onclick="rejectTopicShell(\'' + esc(p.page_id) + '\')">驳回</button>';
  } else if (p.status === 'draft') {
    actionsHtml = '<button class="btn btn-primary btn-sm" onclick="publishWikiPage(\'' + esc(p.page_id) + '\',\'wikiQualityGate\')">发布</button>';
  } else if (p.status === 'needs_recompile') {
    actionsHtml = '<button class="btn btn-primary btn-sm" onclick="recompileWikiPage(\'' + esc(p.page_id) + '\')">重编译</button>';
  } else if (p.status === 'published') {
    actionsHtml = '<button class="btn btn-sm" style="color:var(--red)" onclick="archiveWikiPage(\'' + esc(p.page_id) + '\')">归档</button>';
  }
  var statusLabel = wikiStatusLabel(p.status === 'archived' ? 'archived' : (isTopicShell ? 'draft' : p.status));
  detail.innerHTML = '\
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">\
      <h2 style="font-size:16px;font-weight:700">' + esc(p.title || '') + '</h2>\
      <span class="badge">' + esc(wikiPageTypeLabel(p.page_type) + ' · ' + statusLabel) + '</span>\
    </div>\
    <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">' + actionsHtml + '\
      ' + (isTopicShell ? '' : '<button class="btn btn-sm" onclick="deriveWikiDraft(\'' + esc(p.page_id) + '\',\'' + esc(p.page_type) + '\',\'wikiDraftsPanel\')">派生草稿</button>') + '\
      <button class="btn btn-sm" onclick="closeWikiDetailModal()">关闭</button>\
    </div>\
    <div id="wikiQualityGate" style="margin-bottom:12px"></div>\
    ' + (isTopicShell
      ? '<div style="font-size:12px;color:var(--text-3)">尚未编译——分析成员概念页的论断结构后确认编译，生成第一版内容。</div><div id="topicAnalyzeResult" style="margin-top:10px"></div><div id="topicCompileStatus" style="margin-top:8px;font-size:12px;color:var(--text-3)"></div>'
      : pageBodyHtml(p, { pointRef: 'wikiPointRefPanel', relations: 'wikiRelationsPanel', drafts: 'wikiDraftsPanel', revision: 'wikiRevisionContent' })) + '\
    <h3 style="margin-top:18px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">关联知识点与激活链接</h3>\
    <div id="wikiConceptKPSection" style="margin-top:8px"></div>';
  if (!isTopicShell) {
    loadWikiRelationsPanel(p.page_id, 'wikiRelationsPanel');
    loadWikiDraftsPanel(p.page_id, 'wikiDraftsPanel');
  }
  if (p.entry_id) { loadConceptKPLinksSection(p.entry_id); }
  else { document.getElementById('wikiConceptKPSection').innerHTML = '<div style="font-size:12px;color:var(--text-3)">该页面未关联概念' + (p.page_type === 'topic' ? '（主题页通过成员词条页关联）' : '') + '</div>'; }
}

// wikiPageTypeLabel: concept/fact 词条页与 topic 主题页共用同一批
// 状态徽标、操作按钮渲染逻辑（renderWikiPageDetail 等），唯一的展示差异是
// 这一处的中文名——概念页/事实页对应 docs/impl/v1/wiki.md「概念页 / 事实页」
// 2026-08-03 扩展。
function wikiPageTypeLabel(pageType) {
  if (pageType === 'topic') return '主题页';
  if (pageType === 'fact') return '事实页';
  return '概念页';
}

async function analyzeTopicShell(pageId) {
  var host = document.getElementById('topicAnalyzeResult');
  if (!host) return;
  host.innerHTML = '<div style="color:var(--text-3);font-size:12px">分析中...</div>';
  try {
    var r = await api('POST', '/wiki/pages/' + pageId + '/topic/analyze');
    if (!r.ok || !r.data) { host.innerHTML = '<div style="color:var(--red);font-size:12px">分析失败：' + esc(r.data && r.data.error ? r.data.error : JSON.stringify(r.data)) + '</div>'; return; }
    var claims = r.data.claims || [];
    var tensions = r.data.tensions || [];
    host.innerHTML = '\
      <h3 style="font-size:13px;color:var(--text-3);text-transform:uppercase">拟采用的论断结构（' + claims.length + ' 条）</h3>\
      <div style="margin-top:6px">' + claims.map(function(cl) { return '<div class="detail-row"><span class="dv">' + esc(cl.summary) + ' <span style="color:var(--text-3)">[' + (cl.cited_point_ids||[]).join(', ') + ']</span></span></div>'; }).join('') + '</div>\
      ' + (tensions.length ? '<h3 style="margin-top:10px;font-size:13px;color:var(--text-3);text-transform:uppercase">张力/待验证点</h3><div style="margin-top:6px">' + tensions.map(function(t) { return '<div class="detail-row"><span class="dv">' + esc(t.description) + '</span></div>'; }).join('') + '</div>' : '') + '\
      <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="compileTopicShell(\'' + esc(pageId) + '\')">确认并编译</button>';
    S.topicAnalyzeCache = S.topicAnalyzeCache || {};
    S.topicAnalyzeCache[pageId] = { claims: claims, tensions: tensions };
  } catch(e) { host.innerHTML = '<div style="color:var(--red);font-size:12px">分析出错：' + esc(e.message) + '</div>'; }
}

async function compileTopicShell(pageId) {
  var statusEl = document.getElementById('topicCompileStatus');
  if (statusEl) statusEl.textContent = '编译中，可能需要一些时间...';
  var cached = (S.topicAnalyzeCache && S.topicAnalyzeCache[pageId]) || {};
  try {
    var r = await api('POST', '/wiki/pages/' + pageId + '/topic/compile', { claims: cached.claims || [], tensions: cached.tensions || [] });
    if (r.ok) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--green)">编译成功，已生成草稿</span>';
      refreshWikiPageEverywhere(pageId);
    } else if (statusEl) {
      statusEl.innerHTML = '<span style="color:var(--red)">编译失败：' + esc(r.data && r.data.error ? r.data.error : JSON.stringify(r.data)) + '</span>';
    }
  } catch(e) { if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">编译出错：' + esc(e.message) + '</span>'; }
}

async function rejectTopicShell(pageId) {
  if (!(await showConfirm('确认驳回该主题页候选？壳页将被归档。'))) return;
  try {
    await api('POST', '/wiki/pages/' + pageId + '/archive');
    closeWikiDetailModal();
    loadWikiCatalog();
  } catch(e) { alert('驳回出错：' + e.message); }
}

async function loadConceptKPLinksSection(conceptId) {
  var host = document.getElementById('wikiConceptKPSection');
  if (!host) return;
  host.innerHTML = '<div style="font-size:12px;color:var(--text-3)">加载中...</div>';
  try {
    var cr = await api('GET', '/entries/' + encodeURIComponent(conceptId));
    if (!cr.ok || !cr.data) { host.innerHTML = '<div style="font-size:12px;color:var(--red)">加载失败</div>'; return; }
    var points = cr.data.points || [];
    if (!points.length) { host.innerHTML = '<div style="font-size:12px;color:var(--text-3)">该概念暂无知识点</div>'; return; }
    var pointIds = points.map(function(pt) { return pt.point_id; });
    var lr = await api('GET', '/activation-links?point_ids=' + pointIds.map(encodeURIComponent).join(','));
    var links = (lr.ok && Array.isArray(lr.data)) ? lr.data : [];
    var byPoint = {};
    links.forEach(function(l) { (byPoint[l.point_id] = byPoint[l.point_id] || []).push(l); });
    S.conceptKPLinksCache = byPoint;
    host.innerHTML = points.map(function(pt) { return renderKPLinkRowHtml(pt, byPoint[pt.point_id] || []); }).join('');
  } catch(e) { host.innerHTML = '<div style="font-size:12px;color:var(--red)">加载失败：' + esc(e.message) + '</div>'; }
}

function renderKPLinkRowHtml(point, links) {
  var verified = links.filter(function(l) { return l.status === 'verified'; }).length;
  var candidate = links.filter(function(l) { return l.status === 'candidate'; }).length;
  var badges = '';
  if (verified) badges += '<span class="dcc-status-badge" style="background:var(--green-lt);color:var(--green)">已验证 ' + verified + '</span>';
  if (candidate) badges += '<span class="dcc-status-badge status-pending_confirm">候选 ' + candidate + '</span>';
  if (!links.length) badges = '<span class="dcc-status-badge status-expired">无链接</span>';
  return '<div class="lazy-section" id="kpLinkSection-' + esc(point.point_id) + '">\
    <button type="button" class="lazy-section-head" onclick="toggleKPLinkSection(\'' + esc(point.point_id) + '\')">\
      <span style="text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(point.content || point.point_id) + '</span>\
      <span style="display:flex;gap:4px;flex-shrink:0">' + badges + '</span>\
      <span class="chev">▾</span>\
    </button>\
    <div class="lazy-section-body" id="kpLinkBody-' + esc(point.point_id) + '"></div>\
  </div>';
}

function toggleKPLinkSection(pointId) {
  var section = document.getElementById('kpLinkSection-' + pointId);
  var body = document.getElementById('kpLinkBody-' + pointId);
  if (!section || !body) return;
  if (section.classList.contains('open')) { section.classList.remove('open'); return; }
  section.classList.add('open');
  var links = (S.conceptKPLinksCache && S.conceptKPLinksCache[pointId]) || [];
  body.innerHTML = links.length ? links.map(function(l) {
    return '<div class="q-item" style="cursor:pointer" onclick="selectActivationLink(\'' + esc(l.link_id) + '\')">\
      <div>' + esc(l.question_terms || '') + ' <span class="badge">' + esc(linkStatusValueLabel(l.status)) + '</span></div>\
      <div class="q-meta">采纳 ' + (l.adopt_count||0) + ' / 失败 ' + (l.fail_count||0) + (l.last_used_at ? ' · 最近使用 ' + dateStr(l.last_used_at) : '') + '</div>\
    </div>';
  }).join('') : '<div style="font-size:12px;color:var(--text-3);padding:6px 0">暂无激活链接</div>';
}

function linkStatusValueLabel(s) {
  return activationConfirmStatusLabel(s);
}

// 关系区（docs/impl/v1/page.md 步骤 3 两层架构扩展）：程序派生的只读信息，
// 不提供人工增删关系的入口。
async function loadWikiRelationsPanel(pageId, hostId) {
  var host = document.getElementById(hostId);
  if (!host) return;
  try {
    var r = await api('GET', '/wiki/pages/' + pageId + '/relations');
    var rows = (r.ok && Array.isArray(r.data)) ? r.data : [];
    if (!rows.length) { host.innerHTML = '<div style="font-size:12px;color:var(--text-3)">暂无关系</div>'; return; }
    var labels = { related: '相关', contradicts: '矛盾', contains: '包含' };
    host.innerHTML = rows.map(function(rel) {
      return '<div class="detail-row"><span class="dl">' + esc(labels[rel.relation_type] || rel.relation_type) + '</span><span class="dv">' + esc(rel.title || rel.other_page_id) + '</span></div>';
    }).join('');
  } catch(e) { host.innerHTML = '<div style="font-size:12px;color:var(--red)">加载失败</div>'; }
}

// 写作草稿区（docs/impl/v1/wiki.md 步骤 10）：草稿不进检索、不产生学习信号，
// 页面重编译后草稿只变 stale，不被覆盖，也不提供任何写回页面的入口。
async function loadWikiDraftsPanel(pageId, hostId) {
  var host = document.getElementById(hostId);
  if (!host) return;
  try {
    var r = await api('GET', '/wiki/drafts?page_id=' + pageId);
    var rows = (r.ok && Array.isArray(r.data)) ? r.data : [];
    host.innerHTML = rows.length
      ? rows.map(function(d) { return '<div class="timeline-event" style="display:flex;align-items:center;justify-content:space-between;gap:8px">\
          <span style="cursor:pointer;flex:1;min-width:0" onclick="openWikiDraftEditor(\'' + esc(d.draft_id) + '\')"><b>' + esc(d.title || '(未命名草稿)') + '</b> · ' + dateStr(d.updated_at || d.created_at) + '</span>\
          <button class="btn btn-sm" style="flex-shrink:0" onclick="deleteWikiDraft(\'' + esc(d.draft_id) + '\',\'' + esc(pageId) + '\',\'' + esc(hostId) + '\')">删除</button>\
        </div>'; }).join('')
      : '<div style="font-size:12px;color:var(--text-3)">暂无草稿</div>';
  } catch(e) { host.innerHTML = '<div style="font-size:12px;color:var(--red)">加载失败</div>'; }
}

async function deleteWikiDraft(draftId, pageId, hostId) {
  if (!confirm('确认删除该草稿？草稿删除后不可恢复。')) return;
  try {
    var r = await api('DELETE', '/wiki/drafts/' + draftId);
    if (!r.ok) { alert('删除失败：' + (r.data && (r.data.message || r.data.error) ? (r.data.message || r.data.error) : JSON.stringify(r.data))); return; }
    loadWikiDraftsPanel(pageId, hostId);
  } catch(e) { alert('删除出错：' + e.message); }
}

async function deriveWikiDraft(pageId, pageType, hostId) {
  var mode = pageType === 'topic' ? 'assembled' : 'page';
  try {
    var r = await api('POST', '/wiki/pages/' + pageId + '/drafts', { mode: mode });
    if (r.ok && r.data) { openWikiDraftEditor(r.data.draft_id); loadWikiDraftsPanel(pageId, hostId); }
    else alert('派生草稿失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('派生草稿出错：' + e.message); }
}

async function openWikiDraftEditor(draftId) {
  var overlay = document.getElementById('wikiDraftModal');
  var content = document.getElementById('wikiDraftModalContent');
  content.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-3)">加载中...</div>';
  overlay.classList.remove('hidden');
  try {
    var r = await api('GET', '/wiki/drafts/' + draftId);
    if (!r.ok || !r.data) { content.innerHTML = '<div style="color:var(--red);padding:20px">加载失败</div>'; return; }
    var d = r.data;
    var evidence = d.evidence_index || [];
    content.innerHTML = '\
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">\
        <h2 style="font-size:16px;font-weight:700">写作草稿</h2>\
        ' + (d.stale ? '<span class="badge" style="color:var(--red)">已落后于最新页面版本</span>' : '') + '\
      </div>\
      <div style="display:flex;gap:14px;align-items:flex-start">\
        <div style="flex:1;min-width:0">\
          <input id="draftTitleInput" value="' + esc(d.title || '') + '" style="width:100%;margin-bottom:8px" onblur="saveWikiDraft(\'' + esc(draftId) + '\')">\
          <textarea id="draftContentInput" style="width:100%;min-height:360px;font-family:monospace;font-size:12px" onblur="saveWikiDraft(\'' + esc(draftId) + '\')">' + esc(d.content || '') + '</textarea>\
          <input id="draftNoteInput" placeholder="备注" value="' + esc(d.note || '') + '" style="width:100%;margin-top:8px" onblur="saveWikiDraft(\'' + esc(draftId) + '\')">\
        </div>\
        <div style="width:220px;flex-shrink:0;max-height:420px;overflow:auto">\
          <h3 style="font-size:12px;color:var(--text-3);text-transform:uppercase">证据清单（只读）</h3>\
          ' + evidence.map(function(e) { return '<div class="detail-row" style="cursor:pointer" onclick="navigator.clipboard&&navigator.clipboard.writeText(\'[' + esc(e.point_id) + ']\')" title="点击复制 [' + esc(e.point_id) + ']"><span class="dl">' + esc(e.point_id) + '</span><span class="dv" style="font-size:11px">' + esc(e.point_summary || '') + '</span></div>'; }).join('') + '\
        </div>\
      </div>\
      <div style="margin-top:10px;font-size:12px;color:var(--text-3)">草稿不参与检索；内容要长期沉淀请导出文件，通过导入并勾选「来自 Wiki 草稿」（origin=wiki_draft）导入，避免自体循环。</div>\
      <div class="modal-actions"><button class="btn btn-sm" onclick="document.getElementById(\'wikiDraftModal\').classList.add(\'hidden\')">关闭</button></div>';
  } catch(e) { content.innerHTML = '<div style="color:var(--red);padding:20px">加载失败</div>'; }
}

async function saveWikiDraft(draftId) {
  var title = document.getElementById('draftTitleInput').value;
  var contentVal = document.getElementById('draftContentInput').value;
  var note = document.getElementById('draftNoteInput').value;
  try { await api('PATCH', '/wiki/drafts/' + draftId, { title: title, content: contentVal, note: note }); }
  catch(e) { /* best-effort autosave */ }
}

async function viewWikiRevision(pageId, revId, hostId) {
  var host = document.getElementById(hostId);
  host.innerHTML = '<div class="ku-context">加载中...</div>';
  try {
    var r = await api('GET', '/wiki/pages/' + pageId + '/revisions/' + revId);
    if (!r.ok || !r.data) { host.innerHTML = '<div class="ku-context">加载失败</div>'; return; }
    host.innerHTML = '<div class="panel-section" style="margin-top:10px"><h3>历史版本正文</h3><div class="wiki-page-content ans-body">' + renderWikiContent(r.data.content, hostId) + '</div></div>';
  } catch(e) { host.innerHTML = '<div class="ku-context">加载失败</div>'; }
}

// 发布/重编译/归档三个动作可能是从主题页头部面板发起，也可能是从概念页详情
// 弹窗发起——刷新时两边都要考虑：rail/pane 整体重新加载一遍（覆盖头部面板
// 的情况），如果这个 page_id 恰好也是当前打开的概念页弹窗，弹窗也一并刷新。
function refreshWikiPageEverywhere(pageId) {
  loadWikiCatalog();
  if (S.wikiSelectedId === pageId && !document.getElementById('wikiDetailModal').classList.contains('hidden')) {
    openWikiEntryDetail(pageId);
  }
}

// qualityGateHtml 渲染阶段 G 质量门的预检查结果（docs/impl/v1/
// wiki-generation.md 阶段 G）：通过/未通过状态；未通过时展示后端
// 给出的具体 blocking_reasons（已经是"回放 sufficient 率 0.40 低于门槛
// 0.60"这类可读文案，不在前端重算阈值）并提供"强制发布"按钮。
// qualityGateHtml 只给一句话结论 + 具体原因，不摊开四项指标的数字——具体
// "哪句话/哪条引用有问题"已经直接标在正文里了（renderWikiContent 的颜色
// 标注 + uncited-para），这里只需要告诉人工"能不能发"以及为什么不能。
function qualityGateHtml(qc, pageId) {
  var m = qc.metrics || {};
  if (qc.passed) {
    return '<div style="padding:8px 10px;border-radius:8px;background:var(--green-lt,#e6f4ea);color:var(--green);font-size:12px;margin-bottom:8px">✓ 质量预检查通过，正在发布...</div>';
  }
  var reasons = (m.blocking_reasons || []).map(function(r) { return '<div style="font-size:12px;color:var(--red);margin-top:2px">· ' + esc(r) + '</div>'; }).join('');
  return '<div style="padding:8px 10px;border-radius:8px;background:var(--red-lt,#fde8e8);color:var(--red);font-size:12px;margin-bottom:8px">✕ 质量预检查未通过——具体存疑内容见下方正文中标黄/标红的引用与段落</div>' +
    reasons + '<button class="btn btn-sm" style="margin-top:8px;color:var(--red)" onclick="forcePublishWikiPage(\'' + esc(pageId) + '\')">强制发布</button>';
}

// 发布前先跑一次质量预检查（复用既有 POST /wiki/pages/:id/selfcheck），
// 把四项指标摊开展示，而不是直接尝试发布、失败了才弹一条纯文字 alert——
// 通过则直接继续发布，未通过则停在这里等人工看数字决定是否强制发布
// （docs/impl/v1/wiki-generation.md 阶段 G "与 publish 的关系"）。
async function publishWikiPage(pageId, gateHostId) {
  gateHostId = gateHostId || 'wikiQualityGate';
  var host = document.getElementById(gateHostId);
  if (host) host.innerHTML = '<div style="font-size:12px;color:var(--text-3)">质量预检查中...</div>';
  try {
    var sc = await api('POST', '/wiki/pages/' + pageId + '/selfcheck');
    if (!sc.ok || !sc.data) {
      if (host) host.innerHTML = '';
      return doPublish(pageId);
    }
    if (host) host.innerHTML = qualityGateHtml(sc.data, pageId);
    if (sc.data.passed) { await doPublish(pageId, true); }
  } catch(e) {
    if (host) host.innerHTML = '';
    await doPublish(pageId);
  }
}

async function doPublish(pageId, silent) {
  try {
    var r = await api('POST', '/wiki/pages/' + pageId + '/publish');
    if (r.ok) { refreshWikiPageEverywhere(pageId); }
    else if (!silent) alert('发布失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { if (!silent) alert('发布出错：' + e.message); }
}

async function forcePublishWikiPage(pageId) {
  if (!(await showConfirm('质量预检查未通过，确认强制发布？该操作会被标记为人工强制并留痕进学习报告。'))) return;
  try {
    var r = await api('POST', '/wiki/pages/' + pageId + '/publish', { force: true });
    if (r.ok) { refreshWikiPageEverywhere(pageId); }
    else alert('强制发布失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('强制发布出错：' + e.message); }
}

async function recompileWikiPage(pageId) {
  if (!(await showConfirm('确认重新编译该页面？将生成新的修订版本。'))) return;
  try {
    var r = await api('POST', '/wiki/pages/' + pageId + '/recompile', { reason: 'manual_recompile' });
    if (r.ok) { refreshWikiPageEverywhere(pageId); }
    else alert('重编译失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('重编译出错：' + e.message); }
}

async function archiveWikiPage(pageId) {
  if (!(await showConfirm('确认归档该页面？归档后不可恢复发布。'))) return;
  try {
    var r = await api('POST', '/wiki/pages/' + pageId + '/archive');
    if (r.ok) { refreshWikiPageEverywhere(pageId); }
    else alert('归档失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('归档出错：' + e.message); }
}

// ═══════════════════════════════════════════════════════
// 知识领域：左侧领域列表 + 选中领域的概念网格（已确认概念 + 待确认/已驳回/
// 已过期的新增候选，合并展示在同一个网格里，用卡片状态区分——没有独立的
// 候选列表/状态 Tab 了）
// ═══════════════════════════════════════════════════════
async function loadDomainRail() {
  var list = document.getElementById('domainRailList');
  try {
    var r = await api('GET', '/domains');
    S.domainRailList = (r.ok && Array.isArray(r.data)) ? r.data : [];
  } catch (e) { S.domainRailList = []; }
  if (!S.domainRailSelectedId || !S.domainRailList.some(function(d) { return d.domain_id === S.domainRailSelectedId; })) {
    S.domainRailSelectedId = (S.domainRailList[0] && S.domainRailList[0].domain_id) || null;
  }
  renderDomainRail();
  renderDomainConceptPane();
}

function filterDomainRail(v) { S.domainRailFilter = v; renderDomainRail(); }

function renderDomainRail() {
  var list = document.getElementById('domainRailList');
  var f = (S.domainRailFilter || '').trim().toLowerCase();
  var items = S.domainRailList.filter(function(d) { return !f || d.name.toLowerCase().indexOf(f) !== -1; });
  if (!items.length) { list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:12px">暂无领域</div>'; return; }
  list.innerHTML = items.map(function(d) {
    return '<div class="domain-rail-item' + (d.domain_id === S.domainRailSelectedId ? ' active' : '') + '" onclick="selectDomainRail(\'' + esc(d.domain_id) + '\')">\
      <span class="domain-rail-name">' + esc(d.name) + '</span>\
      <span class="domain-rail-count">' + d.entry_count + '</span>\
      ' + (d.pending_signal_count > 0 ? '<span class="domain-rail-signal" title="' + d.pending_signal_count + ' 条待确认信号">' + d.pending_signal_count + '</span>' : '') + '\
    </div>';
  }).join('');
}

function selectDomainRail(domainId) {
  S.domainRailSelectedId = domainId;
  renderDomainRail();
  renderDomainConceptPane();
}

async function renderDomainConceptPane() {
  var pane = document.getElementById('domainConceptPane');
  var d = S.domainRailList.find(function(x) { return x.domain_id === S.domainRailSelectedId; });
  if (!d) { pane.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:12px">请先新增一个知识领域</div>'; return; }
  var domainId = d.domain_id;

  pane.innerHTML = '\
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">\
      <div style="min-width:0">\
        <div style="font-size:16px;font-weight:700">' + esc(d.name) + '</div>\
        <div style="font-size:12.5px;color:var(--text-2);margin-top:4px">' + esc(d.description || '暂无简介') + '</div>\
        <div style="display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--text-3);flex-wrap:wrap">\
          <span>来源 <b style="color:var(--text)">' + d.source_count + '</b></span>\
          <span>概念 <b style="color:var(--text)">' + d.entry_count + '</b></span>\
          <span>知识点 <b style="color:var(--text)">' + d.kp_count + '</b></span>\
          <span>未归于概念的知识点 <b style="color:var(--text)">' + (d.unassigned_kp_count || 0) + '</b></span>\
        </div>\
      </div>\
      <button class="btn btn-sm" onclick="proposeEntriesFromOrphans(\'' + esc(domainId) + '\')">+ 新增词条</button>\
    </div>\
    <div id="domainConceptTabs" style="margin-top:12px"></div>\
    <div class="domain-concept-grid" id="domainConceptGrid"><div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--text-3);font-size:12px">加载中...</div></div>';

  var conceptsR, domainCandidatesR, pendingR;
  try {
    var results = await Promise.all([
      api('GET', '/entries?domain_id=' + encodeURIComponent(domainId)),
      api('GET', '/entries/candidates/by-domain?domain_id=' + encodeURIComponent(domainId)),
      api('GET', '/entries/candidates?status=pending_confirm')
    ]);
    conceptsR = results[0]; domainCandidatesR = results[1]; pendingR = results[2];
  } catch (e) { conceptsR = domainCandidatesR = pendingR = { ok: false, data: [] }; }
  if (S.domainRailSelectedId !== domainId) return; // 切换领域时旧请求已过期

  S.domainConceptList = (conceptsR.ok && Array.isArray(conceptsR.data)) ? conceptsR.data : [];
  var domainCandidates = (domainCandidatesR.ok && Array.isArray(domainCandidatesR.data)) ? domainCandidatesR.data : [];
  var allPending = (pendingR.ok && Array.isArray(pendingR.data)) ? pendingR.data : [];
  // 合并候选没有 domain_id（涉及两个已有概念，见后端注释），靠 merge_from
  // 里是否包含本领域的 entry_id 来判断要不要在这个领域下露出徽标。
  var mergeCandidates = allPending.filter(function(c) { return c.kind === 'merge'; });

  // S.conceptCandidates 是 confirmEntryCandidate/rejectEntryCandidate/
  // selectEntryCandidate 等既有函数按 candidate_id 查找候选详情用的缓存，
  // 这里把本领域会展示出来的所有候选（新增 + 合并）都放进去。
  var byId = {};
  domainCandidates.forEach(function(c) { byId[c.candidate_id] = c; });
  mergeCandidates.forEach(function(c) { byId[c.candidate_id] = c; });
  S.conceptCandidates = Object.keys(byId).map(function(k) { return byId[k]; });

  function mergeCandidateFor(conceptId) {
    return mergeCandidates.find(function(mc) { return (mc.merge_from || []).indexOf(conceptId) !== -1; });
  }

  var items = [];
  domainCandidates.filter(function(c) { return c.status === 'pending_confirm'; })
    .forEach(function(c) { items.push({ type: 'candidate', data: c }); });
  S.domainConceptList.forEach(function(c) { items.push({ type: 'concept', data: c, merge: mergeCandidateFor(c.entry_id) }); });
  domainCandidates.filter(function(c) { return c.status === 'rejected'; })
    .forEach(function(c) { items.push({ type: 'candidate', data: c }); });
  domainCandidates.filter(function(c) { return c.status === 'expired'; })
    .forEach(function(c) { items.push({ type: 'candidate', data: c }); });

  S.domainConceptItems = items;
  renderDomainConceptTabsAndGrid(domainId);
}

// itemKind 统一取 concept/candidate 两种卡片各自存 kind 的字段名——candidate
// 只有 kind=add 才会出现在这个网格里（ListDomainAddCandidates 已经把 merge
// 候选排除在外，只作为 concept 卡片上的徽标附着），所以 entry_kind 总是有
// 值；没有值（极旧数据）按 concept 兜底，不让卡片消失在两个页签之间。
function domainConceptItemKind(item) {
  var k = item.type === 'concept' ? item.data.kind : item.data.entry_kind;
  return k === 'fact' ? 'fact' : 'concept';
}

function switchDomainConceptTab(tab) {
  S.domainConceptTab = tab;
  var d = S.domainRailList.find(function(x) { return x.domain_id === S.domainRailSelectedId; });
  if (d) renderDomainConceptTabsAndGrid(d.domain_id);
}

function renderDomainConceptTabsAndGrid(domainId) {
  var items = S.domainConceptItems || [];
  var factCount = items.filter(function(i) { return domainConceptItemKind(i) === 'fact'; }).length;
  var conceptCount = items.length - factCount;
  var tab = S.domainConceptTab === 'fact' ? 'fact' : 'concept';

  var tabsEl = document.getElementById('domainConceptTabs');
  if (tabsEl) {
    tabsEl.innerHTML = '<div style="display:flex;gap:6px;border-bottom:1px solid var(--border)">' +
      ['concept', 'fact'].map(function(t) {
        var label = (t === 'fact' ? '事实' : '概念') + ' (' + (t === 'fact' ? factCount : conceptCount) + ')';
        var active = t === tab;
        return '<button class="btn btn-sm" style="border:none;border-radius:0;border-bottom:2px solid ' + (active ? 'var(--text)' : 'transparent') + ';color:' + (active ? 'var(--text)' : 'var(--text-3)') + ';font-weight:' + (active ? '600' : '400') + '" onclick="switchDomainConceptTab(\'' + t + '\')">' + label + '</button>';
      }).join('') + '</div>';
  }

  var filtered = items.filter(function(i) { return domainConceptItemKind(i) === tab; });
  var grid = document.getElementById('domainConceptGrid');
  if (!grid) return;
  var cardsHtml = filtered.length
    ? filtered.map(renderDomainGridCard).join('')
    : '<div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--text-3);font-size:12px">该页签下还没有词条</div>';
  grid.innerHTML = cardsHtml + '<div class="domain-concept-new" onclick="openManualConceptDraft(\'' + esc(domainId) + '\')">+ 新增词条</div>';
}

var CONCEPT_CANDIDATE_STATUS_LABELS = { pending_confirm: '待确认', rejected: '已驳回', expired: '已过期' };

function renderDomainGridCard(item) {
  if (item.type === 'concept') {
    var c = item.data;
    var mergeBadge = item.merge
      ? '<span class="dcc-badge merge" onclick="event.stopPropagation();selectEntryCandidate(\'' + esc(item.merge.candidate_id) + '\')">合并候选</span>'
      : '';
    var kindBadge = c.kind === 'fact' ? '<span class="dcc-badge" style="background:var(--bg-alt);color:var(--text-3);border:1px solid var(--border)">事实</span>' : '';
    return '<div class="domain-concept-card confirmed" onclick="openEntryEditView(\'' + esc(c.entry_id) + '\')">\
      <div class="dcc-top"><div class="dcc-name">' + esc(c.name) + '</div>' + kindBadge + mergeBadge + '</div>\
      <div class="dcc-desc">' + esc(c.description || '') + '</div>\
      <div class="dcc-kp">' + c.kp_count + ' 个知识点</div>\
    </div>';
  }
  var c = item.data;
  var statusLabel = CONCEPT_CANDIDATE_STATUS_LABELS[c.status] || c.status;
  var origin = conceptCandidateOrigin(c);
  var originLabel = origin === 'content_driven' ? '导入内容' : origin === 'manual' ? '人工新增' : origin === 'usage_driven' ? '查询信号' : '';
  var candidateKindBadge = (c.kind === 'add' && c.entry_kind === 'fact')
    ? '<span class="dcc-badge" style="background:var(--bg-alt);color:var(--text-3);border:1px solid var(--border)">事实</span>' : '';
  return '<div class="domain-concept-card candidate status-' + esc(c.status) + '" onclick="selectEntryCandidate(\'' + esc(c.candidate_id) + '\')">\
    <div class="dcc-top"><div class="dcc-name">' + esc(c.suggested_name || '(未命名)') + '</div>' + candidateKindBadge + '<span class="dcc-status-badge status-' + esc(c.status) + '">' + esc(statusLabel) + '</span></div>\
    <div class="dcc-desc">' + (originLabel ? esc(originLabel) + ' · ' : '') + (c.point_ids || []).length + ' 个关联知识点</div>\
    <div class="dcc-kp">最近信号 ' + dateStr(c.last_signal_at) + '</div>\
  </div>';
}

function openDomainCreateForm() {
  document.getElementById('domainCreateName').value = '';
  document.getElementById('domainCreateDesc').value = '';
  document.getElementById('domainCreateModal').classList.remove('hidden');
}
function closeDomainCreateModal() {
  document.getElementById('domainCreateModal').classList.add('hidden');
}
async function submitDomainCreateForm() {
  var name = document.getElementById('domainCreateName').value.trim();
  var description = document.getElementById('domainCreateDesc').value.trim();
  if (!name) { alert('请填写领域名称'); return; }
  try {
    var r = await api('POST', '/domains', { name: name, description: description });
    if (!r.ok) { alert('创建失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data))); return; }
    closeDomainCreateModal();
    S.domainRailSelectedId = r.data.domain_id;
    await loadDomainRail();
  } catch (e) { alert('创建出错：' + e.message); }
}

// 「知识领域」页面的"+ 新增词条"：对该领域下未归于已确认词条、也未挂在
// 待确认候选上的知识点，跑与文件导入一致的 classify-then-branch 流水线
// （POST /entries/domains/:id/propose-from-orphans，docs/impl/v1/kpn.md
// 步骤 3）：先判 concept/fact → 同 kind 挂靠已有词条 → 剩余 fact 按
// concept 维度建 entity+concept 候选、剩余 concept 自由命名。这里只触发
// 流水线，新建候选仍需人工确认/驳回。
async function proposeEntriesFromOrphans(domainId) {
  var btns = document.querySelectorAll('[onclick="proposeEntriesFromOrphans(\'' + domainId + '\')"]');
  btns.forEach(function(b) { b.disabled = true; b.textContent = '聚类中...'; });
  try {
    var r = await api('POST', '/entries/domains/' + encodeURIComponent(domainId) + '/propose-from-orphans');
    if (!r.ok) { alert('聚类失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data))); return; }
    var touched = (r.data && r.data.proposals_touched) || 0;
    alert(touched > 0 ? ('已生成 ' + touched + ' 个待确认概念候选') : '没有可聚类的未归类知识点');
    pollConceptPendingCount();
    loadDomainRail();
  } catch (e) {
    alert('聚类出错：' + e.message);
  } finally {
    btns.forEach(function(b) { b.disabled = false; b.textContent = '+ 新增词条'; });
  }
}

// "新增"：只在前端开一个草稿表单，不调用后端、不落库——复用既有的候选
// 确认对话框 UI（选领域/填名字/加 KP），但候选行本身要等草稿的"确认"或
// "驳回"按钮点击后才真正创建，避免用户中途关闭也在概念网格里留下一条空
// 记录。preferredDomainId 让「知识领域」页面里点某个领域的"+ 新增词条"
// 时直接预选该领域，而不是总落回第一个领域。
async function openManualConceptDraft(preferredDomainId) {
  var domains = await ensureDomainsLoaded();
  var initialDomain = (preferredDomainId && domains.some(function(d) { return d.domain_id === preferredDomainId; }))
    ? preferredDomainId
    : ((domains[0] && domains[0].domain_id) || '');
  var draft = { candidate_id: null, kind: 'add', status: 'draft', domain_id: initialDomain, suggested_name: '', point_ids: [], evidence: { origin: 'manual' }, event_ids: [] };
  S.conceptDraftActive = true;
  S.conceptDraftCandidate = draft;
  S.conceptSelectedId = null;

  document.getElementById('conceptDetailModal').classList.remove('hidden');
  S.conceptFormSelectedDomain = initialDomain;
  S.conceptFormPointIds = [];
  S.conceptFormShowAddPicker = false;
  S.conceptFormAvailablePoints = null;

  var entries = await loadEntriesForDomain(initialDomain);
  if (!S.conceptDraftActive) return; // closed while domains/entries were loading
  renderEntryCandidateDetail(draft, domains, entries, initialDomain, [], {});
}

function readManualConceptDraftForm() {
  var domainSel = document.getElementById('conceptConfirmDomainSelect');
  var nameInput = document.getElementById('conceptConfirmConceptNewInput');
  var descInput = document.getElementById('conceptConfirmDescriptionInput');
  var kindSel = document.getElementById('conceptConfirmKindSelect');
  return {
    domain_id: domainSel ? domainSel.value : '',
    suggested_name: nameInput ? nameInput.value.trim() : '',
    description: descInput ? descInput.value.trim() : '',
    kind: kindSel ? kindSel.value : '',
    point_ids: (S.conceptFormPointIds || []).map(function(p) { return p.point_id; })
  };
}

async function saveManualConceptDraft() {
  var body = readManualConceptDraftForm();
  try {
    var r = await api('POST', '/entries/candidates', body);
    if (!r.ok) { alert('保存失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data))); return; }
    closeEntryDetailModal();
    pollConceptPendingCount();
    loadDomainRail();
  } catch(e) { alert('保存出错：' + e.message); }
}

async function rejectManualConceptDraft() {
  var body = readManualConceptDraftForm();
  try {
    var r = await api('POST', '/entries/candidates', body);
    if (!r.ok) { alert('保存失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data))); return; }
    var r2 = await api('POST', '/entries/candidates/' + r.data.candidate_id + '/reject');
    if (!r2.ok) { alert('驳回失败：' + (r2.data && r2.data.message ? r2.data.message : JSON.stringify(r2.data))); return; }
    closeEntryDetailModal();
    pollConceptPendingCount();
    loadDomainRail();
  } catch(e) { alert('操作出错：' + e.message); }
}

// content_driven（KPN 跨 Source 匹配导入时产生，见 docs/impl/v1/kpn.md 步骤 3）
// / usage_driven（本模块自身基于查询信号聚类，既有行为）/ manual（"新增"按钮
// 手动创建）——只用于展示，不影响确认逻辑。
function conceptCandidateOrigin(c) {
  if (c.kind !== 'add' || !c.evidence) return '';
  if (c.evidence.origin === 'content_driven') return 'content_driven';
  if (c.evidence.origin === 'manual') return 'manual';
  return 'usage_driven';
}

async function selectEntryCandidate(candidateId) {
  S.conceptDraftActive = false;
  S.conceptDraftCandidate = null;
  S.conceptSelectedId = candidateId;
  var c = S.conceptCandidates.find(function(x) { return x.candidate_id === candidateId; });
  var detail = document.getElementById('conceptDetailModalContent');
  document.getElementById('conceptDetailModal').classList.remove('hidden');
  if (!c) { detail.innerHTML = '<div style="color:var(--red);padding:20px">未找到候选</div>'; return; }

  detail.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-3);font-size:13px">加载中...</div>';
  var points = await loadEntryCandidatePoints(c.point_ids || []);
  var conceptNames = c.kind === 'merge' ? await loadConceptNamesByIds(c.merge_from || []) : {};
  // A candidate may have been re-selected while these async loads were in
  // flight — bail if the user has since moved on.
  if (S.conceptSelectedId !== candidateId) return;

  if (c.status === 'pending_confirm' && c.kind === 'add') {
    var domains = await ensureDomainsLoaded();
    var initialDomain = c.domain_id || (domains[0] && domains[0].domain_id) || '';
    var entries = await loadEntriesForDomain(initialDomain);
    if (S.conceptSelectedId !== candidateId) return;
    S.conceptFormSelectedDomain = initialDomain;
    S.conceptFormPointIds = points.slice();
    S.conceptFormShowAddPicker = false;
    S.conceptFormAvailablePoints = null;
    renderEntryCandidateDetail(c, domains, entries, initialDomain, points, conceptNames);
    return;
  }
  renderEntryCandidateDetail(c, null, null, null, points, conceptNames);
}

// ═══════════════════════════════════════════════════════
// 已确认概念详情/编辑：改名、改描述、增删关联知识点。这是对已有结构的
// 直接编辑，不是概念演化候选，所以没有确认/驳回步骤——保存即生效。
// ═══════════════════════════════════════════════════════
async function openEntryEditView(conceptId) {
  var box = document.getElementById('conceptEditModalContent');
  document.getElementById('conceptEditModal').classList.remove('hidden');

// 后端 GetEntryDetail 判断并决定按钮是否渲染，前端不重复这层判断。
async function revokeEntryConfirm(candidateId) {
  if (!(await showConfirm('确认撤销该已确认词条？这会删除该词条，并把关联知识点迁回未归类状态，同时清理由它触发的跨 Source 关系。'))) return;
  try {
    var r = await api('POST', '/entries/candidates/' + candidateId + '/restore');
    if (!r.ok) { alert('撤销失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data))); return; }
    closeEntryEditModal();
    loadDomainRail();
    if (typeof renderDomainConceptPane === 'function') renderDomainConceptPane();
  } catch(e) { alert('撤销出错：' + e.message); }
}

// 关联 KP 不止要显示数量，还要显示内容和所属文件名——分别取自
// GET /points/:id（content/source_id）和 GET /sources/:id（title），
// 数量通常很小（几个到十几个），逐条请求足够，不新增批量端点。
async function loadEntryCandidatePoints(pointIds) {
  var results = await Promise.all(pointIds.map(async function(pid) {
    try {
      var r = await api('GET', '/points/' + encodeURIComponent(pid));
      return (r.ok && r.data) ? r.data : null;
    } catch (e) { return null; }
  }));
  var points = results.filter(Boolean);

  var sourceIds = [];
  var seenSource = {};
  points.forEach(function(p) {
    if (p.source_id && !seenSource[p.source_id]) { seenSource[p.source_id] = true; sourceIds.push(p.source_id); }
  });
  var titles = {};
  await Promise.all(sourceIds.map(async function(sid) {
    try {
      var r = await api('GET', '/sources/' + encodeURIComponent(sid));
      titles[sid] = (r.ok && r.data && r.data.title) ? r.data.title : sid;
    } catch (e) { titles[sid] = sid; }
  }));

  return points.map(function(p) {
    return { point_id: p.point_id, content: p.content, source_title: titles[p.source_id] || p.source_id };
  });
}

// 合并候选的 merge_from 只有 entry_id，界面上要显示概念名而不是裸 id。
async function loadConceptNamesByIds(conceptIds) {
  try {
    var r = await api('GET', '/entries');
    var map = {};
    (r.ok && Array.isArray(r.data) ? r.data : []).forEach(function(cc) { map[cc.entry_id] = cc.name; });
    var names = {};
    conceptIds.forEach(function(cid) { names[cid] = map[cid] || cid; });
    return names;
  } catch (e) {
    var fallback = {};
    conceptIds.forEach(function(cid) { fallback[cid] = cid; });
    return fallback;
  }
}

// 概念名称控件是一个"槽位"：默认渲染成和领域名称样式、交互完全一致的原生
// select——只列出该领域的真实概念，不混入"+ 新建概念..."这种伪选项（会
// 破坏原生下拉的可点击展开行为，且列表里出现非概念的操作项本身也不合适）。
// "新建"是 select 之外单独的入口，点击后整个槽位就地换成文本输入框，
// 不额外常驻第二个字段。
function conceptSlotSelectHtml(entries, selectedConceptId) {
  var options = entries.map(function(cc) {
    return '<option value="' + esc(cc.entry_id) + '"' + (cc.entry_id === selectedConceptId ? ' selected' : '') + '>' + esc(cc.name) + '</option>';
  }).join('');
  var newLink = '<div style="margin-top:4px"><a href="javascript:void(0)" onclick="switchConceptSlotToNew()" style="font-size:12px;color:var(--text-3);text-decoration:underline">+ 新建概念...</a></div>';
  return '<select id="conceptConfirmConceptSelect" style="width:100%">' + options + '</select>' + newLink;
}

// 内联样式复制自全局 `select { ... }` 规则（第 468 行附近），让新概念名
// 输入框和领域名称/概念名称的原生 select 边框颜色、圆角、内边距、高度
// 完全一致——文本输入框没有对应的全局 CSS 规则，不手动补上就会退化成
// 浏览器默认样式。
var CONCEPT_INPUT_STYLE = 'width:100%;box-sizing:border-box;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px;background:var(--bg);outline:none;color:var(--text)';

// 概念/事实分类（docs/impl/v1/kpn.md 步骤 3「类型标注」）：讲底层理论/
// 原理/规则的是概念，讲具体实现/技术/产品对象的是事实。空值按后端
// ValidateEntryKind 的默认值处理为概念。
function conceptKindSelectHtml(id, selectedKind) {
  var isFact = selectedKind === 'fact';
  return '<select id="' + id + '" style="width:100%;margin-top:4px">\
    <option value="concept"' + (isFact ? '' : ' selected') + '>概念（理论 / 原理 / 规则）</option>\
    <option value="fact"' + (isFact ? ' selected' : '') + '>事实（具体实现 / 技术 / 产品）</option>\
  </select>';
}

function conceptSlotNewInputHtml(entries, nameValue) {
  var backLink = entries.length ? '<div style="margin-top:4px"><a href="javascript:void(0)" onclick="switchConceptSlotToSelect()" style="font-size:12px;color:var(--text-3);text-decoration:underline">从已有概念中选择</a></div>' : '';
  return '<input id="conceptConfirmConceptNewInput" type="text" value="' + esc(nameValue||'') + '" placeholder="输入新词条名称" style="' + CONCEPT_INPUT_STYLE + '">' + backLink;
}

// 建议名称若与该领域下某个已有概念同名，默认展示为已选中该概念的 select——
// 这正是修正 unit_entry_match 漏判的典型场景；否则（含该领域尚无任何
// 概念的情况）直接展示为待编辑的新概念名输入框。
function buildConceptSlotHtml(entries, suggestedName) {
  var matched = entries.find(function(cc) { return cc.name === suggestedName; });
  if (matched) return conceptSlotSelectHtml(entries, matched.entry_id);
  return conceptSlotNewInputHtml(entries, suggestedName);
}

function switchConceptSlotToNew() {
  var slot = document.getElementById('conceptConfirmConceptSlot');
  if (!slot) return;
  slot.innerHTML = conceptSlotNewInputHtml(S.conceptFormConcepts || [], S.conceptFormSuggestedName || '');
  var input = document.getElementById('conceptConfirmConceptNewInput');
  if (input) input.focus();
}

function switchConceptSlotToSelect() {
  var slot = document.getElementById('conceptConfirmConceptSlot');
  if (!slot) return;
  slot.innerHTML = conceptSlotSelectHtml(S.conceptFormConcepts || [], null);
}

// 切换领域后概念槽位必须刷新为该领域下的概念列表，否则会把上一个领域的
// entry_id 提交给新领域（后端并不校验两者归属一致）。
async function onEntryConfirmDomainChange() {
  var domainSel = document.getElementById('conceptConfirmDomainSelect');
  var slot = document.getElementById('conceptConfirmConceptSlot');
  if (!domainSel || !slot) return;
  S.conceptFormSelectedDomain = domainSel.value;
  // 添加面板的候选池按领域取数，换领域后旧的一批不再适用，收起并清空缓存
  // （不自动重新拉取——等用户再次点开"+ 添加知识点"时按新领域重新请求）。
  S.conceptFormShowAddPicker = false;
  S.conceptFormAvailablePoints = null;
  if (S.conceptDraftActive) {
    // 草稿模式没有"归入已有概念"入口（还没有候选行，这个决策留到真正
    // 确认执行时），换领域只保留用户已输入的名字，不必拉取该领域概念列表。
    var typedName = document.getElementById('conceptConfirmConceptNewInput');
    slot.innerHTML = conceptSlotNewInputHtml([], typedName ? typedName.value : S.conceptFormSuggestedName);
    refreshConceptFormPointsSection();
    return;
  }
  var entries = await loadEntriesForDomain(domainSel.value);
  S.conceptFormConcepts = entries;
  slot.innerHTML = buildConceptSlotHtml(entries, S.conceptFormSuggestedName);
  refreshConceptFormPointsSection();
}

async function confirmEntryCandidate(candidateId) {
  var c = S.conceptCandidates.find(function(x) { return x.candidate_id === candidateId; });
  if (!c) return;
  if (!(await showConfirm('确认执行该概念候选？这会立即改变概念结构（' + (c.kind === 'merge' ? '合并概念、迁移知识点、标记相关 Wiki 页面重编译' : '创建新概念并迁移知识点，或归入已选择的已有概念') + '）。'))) return;
  var body = {};
  if (c.kind === 'add') {
    var pointIds = (S.conceptFormPointIds || []).map(function(p) { return p.point_id; });
    if (!pointIds.length) { alert('至少需要保留一个关联知识点'); return; }
    var conceptSelect = document.getElementById('conceptConfirmConceptSelect');
    if (conceptSelect) {
      body.entry_id = conceptSelect.value;
    } else {
      var domainSel = document.getElementById('conceptConfirmDomainSelect');
      var newInput = document.getElementById('conceptConfirmConceptNewInput');
      var descInput = document.getElementById('conceptConfirmDescriptionInput');
      var kindSel = document.getElementById('conceptConfirmKindSelect');
      body.suggested_name = newInput ? newInput.value.trim() : '';
      body.domain_id = domainSel ? domainSel.value : '';
      body.description = descInput ? descInput.value.trim() : '';
      body.kind = kindSel ? kindSel.value : '';
    }
    body.point_ids = pointIds;
  } else {
    body.target = document.getElementById('conceptConfirmTarget').value;
  }
  try {
    var r = await api('POST', '/entries/candidates/' + candidateId + '/confirm', body);
    if (r.ok) { pollConceptPendingCount(); closeEntryDetailModal(); loadDomainRail(); }
    else alert('操作失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('操作出错：' + e.message); }
}

async function rejectEntryCandidate(candidateId) {
  if (!(await showConfirm('确认驳回该概念候选？'))) return;
  try {
    var r = await api('POST', '/entries/candidates/' + candidateId + '/reject');
    if (r.ok) { pollConceptPendingCount(); closeEntryDetailModal(); loadDomainRail(); }
    else alert('操作失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('操作出错：' + e.message); }
}

async function deleteEntryCandidate(candidateId) {
  if (!(await showConfirm('确认删除该候选？这会彻底删除记录，不会像驳回那样留在已驳回列表里，无法恢复。'))) return;
  try {
    var r = await api('DELETE', '/entries/candidates/' + candidateId);
    if (r.ok) { pollConceptPendingCount(); closeEntryDetailModal(); loadDomainRail(); }
    else alert('删除失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('操作出错：' + e.message); }
}

async function restoreEntryCandidate(candidateId) {
  var c = S.conceptCandidates.find(function(x) { return x.candidate_id === candidateId; });
  var msg = c && c.status === 'applied'
    ? '确认将该候选恢复到待确认？这会撤销已新建的概念，并把关联知识点迁回未归类状态。'
    : '确认将该候选恢复到待确认？';
  if (!(await showConfirm(msg))) return;
  try {
    var r = await api('POST', '/entries/candidates/' + candidateId + '/restore');
    if (r.ok) { pollConceptPendingCount(); closeEntryDetailModal(); loadDomainRail(); }
    else alert('操作失败：' + (r.data && r.data.message ? r.data.message : JSON.stringify(r.data)));
  } catch(e) { alert('操作出错：' + e.message); }
}

// 待确认徽标：pending_confirm 的概念候选数量，与其他徽标共用 30 秒轮询周期。

  try {
    var r = await api('GET', '/entries/candidates?status=pending_confirm');

    var badge = document.getElementById('conceptPendingBadge');

async function loadSessions() {
  try {
    var r = await api('GET', '/sessions');
    if (r.ok && r.data && r.data.sessions) {
      S.sessions = r.data.sessions;
      renderSessionList();
    }
  } catch(e) { console.error('Failed to load sessions', e); }
}

function relativeTime(dateStr) {
  if (!dateStr) return '';
  try {
    var d = new Date(dateStr);
    var now = new Date();
    var diffMs = now - d;
    var diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return '刚才';
    if (diffMin < 60) return diffMin + ' 分钟前';
    var diffHr = Math.floor(diffMin / 60);
    if (diffHr < 24) return diffHr + ' 小时前';
    var diffDay = Math.floor(diffHr / 24);
    if (diffDay === 1) return '昨天';
    if (diffDay < 7) return diffDay + ' 天前';
    return d.toLocaleDateString('zh-CN', { month:'numeric', day:'numeric' });
  } catch(e) { return ''; }
}

function dateGroupLabel(dateStr) {
  if (!dateStr) return '未知';
  try {
    var d = new Date(dateStr);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var yesterday = new Date(today - 86400000);
    var itemDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (itemDay >= today) return '今天';
    if (itemDay >= yesterday) return '昨天';
    var diffDay = Math.floor((today - itemDay) / 86400000);
    if (diffDay < 7) return '本周';
    return '更早';
  } catch(e) { return '未知'; }
}

function buildSessionListHtml() {
  if (!S.sessions.length) {
    return '<div style="padding:16px 22px;color:var(--text-3);font-size:12px">暂无记录</div>';
  }
  var html = '';
  var lastGroup = '';
  S.sessions.forEach(function(sess) {
    var group = dateGroupLabel(sess.updated_at);
    if (group !== lastGroup) {
      html += '<div class="history-group-label">' + esc(group) + '</div>';
      lastGroup = group;
    }
    var active = (S.sessionId === sess.session_id) ? ' active' : '';
    var title = sess.title || '新对话';
    var time = relativeTime(sess.updated_at);
    html += '<div class="history-item' + active + '" onclick="switchSession(\'' + esc(sess.session_id) + '\')" title="' + esc(title) + '">';
    html += '<span class="hi-title">' + esc(title) + '</span>';
    html += '<span class="hi-time">' + esc(time) + '</span>';
    html += '<span class="hi-del" onclick="event.stopPropagation();deleteSession(\'' + esc(sess.session_id) + '\')" title="删除">✕</span>';
    html += '</div>';
  });
  return html;
}

function renderSessionList() {
  var html = buildSessionListHtml();
  document.getElementById('historyList').innerHTML = html;
  document.getElementById('historyPopoverBody').innerHTML = html;
}

async function switchSession(sessionId) {
  S.sessionId = sessionId;
  S.currentAnswer = null;
  S.currentTrace = null;
  closeHistoryPopover();
  renderSessionList();
  enterChatMode();
  document.getElementById('chatInner').innerHTML = '';
  // 历史会话没有实时处理过程可看，直接隐藏整个处理过程面板，聊天区域占满宽度。
  var pp = document.getElementById('processPanel');
  if (pp) pp.classList.add('pp-hidden');

  try {
    var tr = await api('GET', '/sessions/' + sessionId + '/turns');
    if (tr.ok && tr.data && tr.data.turns) {
      for (var i = 0; i < tr.data.turns.length; i++) {
        var t = tr.data.turns[i];
        var isLast = (i === tr.data.turns.length - 1);
        appendUserMsg(t.user_input, isLast);
        if (t.action === 'interrupted') {
          appendSystemMsg('对话已重置');
        } else if (t.action === 'clarify' && t.clarify_msg) {
          appendClarifyRecord(t.clarify_msg);
        } else if (t.action === 'retrieve') {
          if (t.answer_id) {
            var ar = await api('GET', '/answers/' + t.answer_id);
            if (ar.ok && ar.data) {
              S.currentAnswer = ar.data;
              appendAnswerMsg(ar.data);
              fetchTraceForAnswer(ar.data.answer_id);
            }
          } else {
            appendSystemMsg('（回答记录未关联）');
          }
        }
      }
    }
    renderRightPanel();
  } catch(e) { console.error('Failed to load session', e); }
}

function appendClarifyRecord(msg) {
  var el = div('msg msg-system');
  el.innerHTML = '<div class="msg-bubble" style="background:var(--bg-alt);border:1px solid var(--border);padding:12px;font-size:13px;color:var(--text-2)">' + esc(msg) + '</div>';
  chatInner().appendChild(el);
  scrollThread();
}

async function deleteSession(sessionId) {
  await api('DELETE', '/sessions/' + sessionId);
  if (S.sessionId === sessionId) {
    S.sessionId = null;
    S.currentAnswer = null;
    S.currentTrace = null;
    await loadSessions();
    if (S.sessions.length > 0) {
      switchSession(S.sessions[0].session_id);
    } else {
      newConversation();
    }
  } else {
    loadSessions();
  }
}

async function newConversation() {
  var sr = await api('POST', '/sessions');
  if (sr.ok && sr.data) {
    S.sessionId = sr.data.session_id;
  } else {
    S.sessionId = null;
  }
  S.currentAnswer = null;
  S.currentTrace = null;
  closeHistoryPopover();
  if (S.explainOpen) closeExplainDrawer();
  document.getElementById('chatInner').innerHTML = '';
  document.getElementById('panelContent').innerHTML = '<div class="panel-empty">提交问题后查看解释与证据</div>';
  var pp = document.getElementById('processPanel');
  if (pp) { pp.innerHTML = '<div class="pp-empty">提问后查看处理过程</div>'; pp.classList.remove('pp-hidden'); }
  enterWelcomeMode();
  loadSessions();
}

  }).join('') + '</div>';
}
function dateStr(s) { if (!s) return ''; try { return new Date(s).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e) { return s||''; } }
function qualityLabel(q) { return {confident:'置信',partial:'部分',gap:'缺口'}[q] || q || '未知'; }
function pathLabel(p) { return {short:'简洁模式',deep:'深度推理',none:'无法回答',error:'出错'}[p] || p || '未知'; }
function statusLabel(s) { return {pending:'等待中',processing:'处理中',completed:'已完成',failed:'失败',deleted:'已删除'}[s] || s || '未知'; }

// sourceDisplayStatus folds units_status (knowledge-unit extraction, a
// separate async step — see sources.units_status) into the status badge:
// a source whose own processing finished (status === 'completed') still
// shows as "处理中" until units_status also reaches completed, instead of
// the badge claiming 已完成 while extraction hasn't even started yet.
function sourceDisplayStatus(s) {
  if (s.status === 'completed' && s.units_status === 'failed') {
    return 'failed';
  }
  if (s.status === 'completed' && s.units_status && s.units_status !== 'completed') {
    return 'processing';
  }
  return s.status;
}
function recLabel(r) { return {strong:'强推荐',candidate:'候选',ready:'可编译',needs_more_data:'数据不足'}[r] || r || '-'; }
function reasonLabel(r) { return {no_candidates:'未检索到',judge_filtered:'检索到但被判无关',answer_error:'生成失败',unspecified:'原因不明'}[r] || r || '-'; }

// showConfirm replaces window.confirm with an in-page modal (same visual
// language as the rest of the app instead of the browser's native chrome).
// Returns a Promise<boolean> so call sites just do `await showConfirm(msg)`.
function showConfirm(message) {
  return new Promise(function(resolve) {
    var overlay = document.getElementById('confirmOverlay');
    var msgEl = document.getElementById('confirmMessage');
    var okBtn = document.getElementById('confirmOkBtn');
    var cancelBtn = document.getElementById('confirmCancelBtn');
    msgEl.textContent = message;
    overlay.classList.remove('hidden');
    function cleanup(result) {
      overlay.classList.add('hidden');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onOverlayClick);
      document.removeEventListener('keydown', onKeydown);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onOverlayClick(e) { if (e.target === overlay) cleanup(false); }
    function onKeydown(e) { if (e.key === 'Escape') cleanup(false); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlayClick);
    document.addEventListener('keydown', onKeydown);
  });
}

async function copy(text, el) {
  if (!text) return;
  try { await navigator.clipboard.writeText(text); var orig = el.textContent; el.textContent = '已复制'; setTimeout(function() { el.textContent = orig; }, 1200); }
  catch(e) { console.warn('Copy failed'); }
}

function autoResize(el) {
  var maxH = Math.floor(window.innerHeight * 0.4);
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, maxH) + 'px';
}

function inputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (S.chatMode) submitQuestion();
    else submitFromWelcome();
    return;
  }
  if (e.key === 'Enter' && e.shiftKey) {
    // 换行后按内容增高；下一帧再量 scrollHeight，避免量到插入前的高度
    var el = e.target;
    requestAnimationFrame(function() { autoResize(el); });
  }
}

document.getElementById('chatInner').addEventListener('click', function(e) {
  var a = e.target.closest('a[href^="evidence:"]');
  if (!a) return;
  e.preventDefault();
  // 两种 href 形态：evidence:<answer_id>:<fact_id>（新）/ evidence:<fact_id>（流式临时链接）。
  // UUID 不含冒号，安全按冒号拆分。
  var rest = a.getAttribute('href').slice('evidence:'.length);
  var sep = rest.indexOf(':');
  if (sep === -1) openEvidenceInDrawer(rest);
  else openEvidenceInDrawer(rest.slice(sep + 1), rest.slice(0, sep));
});
